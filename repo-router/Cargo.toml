[package]
name = "scope-repo-router"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
scope_service_runtime = { workspace = true }
anyhow.workspace = true
axum.workspace = true
reqwest = { workspace = true, features = ["rustls", "stream"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
scope_service_runtime = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
tokio-stream = "0.1.17"
tower = { workspace = true, features = ["util"] }
