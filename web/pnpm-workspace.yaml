minimumReleaseAge: 10080
trustPolicy: no-downgrade
# pnpm compares trust across semver majors, which incorrectly flags semver 6.
trustPolicyExclude:
  - semver@6.3.1
blockExoticSubdeps: true
overrides:
  # Chevrotain 11 pins a vulnerable lodash-es patch; the replacement stays in major 4.
  lodash-es: 4.18.1
supportedArchitectures:
  os:
    - current
    - linux
    - win32
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
allowBuilds:
  bufferutil: false
  core-js: false
  utf-8-validate: false
