name: Cache and database staging experiment
'on':
  manual: true
container:
  image: 957143340948.dkr.ecr.us-east-1.amazonaws.com/scope-vcs/production/checks@sha256:a3ed25023a60d000a8c93264518e9cdfd656f6832a6940a2eda7991db2ebbc9f
timeout: 45m
env:
  CARGO_HOME: /scope/cache/cargo
  CARGO_TARGET_DIR: /workspace/target
  RUSTUP_TOOLCHAIN: 1.98.0-x86_64-unknown-linux-gnu
  SCOPE_CACHE_EXPERIMENT_REVISION: one
jobs:
  baseline:
    timeout: 45m
    caches:
    - name: cargo
      path: /scope/cache/cargo
      format: v1
      compatibility: &id001
        files:
        - rust-toolchain.toml
        environment:
        - RUSTUP_TOOLCHAIN
        - CARGO_INCREMENTAL
        - CARGO_PROFILE_DEV_DEBUG
        - CARGO_PROFILE_TEST_DEBUG
        source: false
      exact:
        files: &id002
        - Cargo.lock
        - Cargo.toml
        - api/Cargo.toml
        - cache-service/Cargo.toml
        - crates/scope-api-contract/Cargo.toml
        - crates/scope-cache-contract/Cargo.toml
        - crates/scope-cache-domain/Cargo.toml
        - crates/scope-content-lifecycle/Cargo.toml
        - crates/scope-domain/Cargo.toml
        - crates/scope-git-process/Cargo.toml
        - crates/scope-git/Cargo.toml
        - crates/scope-object-store/Cargo.toml
        - crates/scope-postgres/Cargo.toml
        - crates/scope-run-config/Cargo.toml
        - runner-runtime/Cargo.toml
        - worker/Cargo.toml
        environment: []
        source: false
    - name: cargo-target
      path: /scope/cache/cargo-target
      format: v1
      compatibility: *id001
      exact:
        files: *id002
        environment: []
        source: true
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_DIR: /scope/cache/cargo-target
      SCOPE_TEST_DATABASE_URL: postgres://scope:scope@127.0.0.1:5432/scope_test
      SCOPE_CACHE_EXPERIMENT_MODE: baseline
      SCOPE_DB_EXPERIMENT_MODE: baseline
    steps:
    - name: Measure backend cache and test setup
      run: 'service postgresql start

        su postgres -c "psql --set=ON_ERROR_STOP=1 --command=\"CREATE ROLE scope LOGIN
        CREATEDB PASSWORD ''scope''\""

        su postgres -c "createdb --owner=scope scope_test"

        node dev/cache-db-experiment/run.mjs'
  content:
    timeout: 45m
    caches:
    - name: cargo
      path: /scope/cache/cargo
      format: v1
      compatibility: &id003
        files:
        - rust-toolchain.toml
        environment:
        - RUSTUP_TOOLCHAIN
        - CARGO_INCREMENTAL
        - CARGO_PROFILE_DEV_DEBUG
        - CARGO_PROFILE_TEST_DEBUG
        source: false
      exact:
        files: &id004
        - Cargo.lock
        - Cargo.toml
        - api/Cargo.toml
        - cache-service/Cargo.toml
        - crates/scope-api-contract/Cargo.toml
        - crates/scope-cache-contract/Cargo.toml
        - crates/scope-cache-domain/Cargo.toml
        - crates/scope-content-lifecycle/Cargo.toml
        - crates/scope-domain/Cargo.toml
        - crates/scope-git-process/Cargo.toml
        - crates/scope-git/Cargo.toml
        - crates/scope-object-store/Cargo.toml
        - crates/scope-postgres/Cargo.toml
        - crates/scope-run-config/Cargo.toml
        - runner-runtime/Cargo.toml
        - worker/Cargo.toml
        environment: []
        source: false
    - name: cargo-target
      path: /scope/cache/cargo-target
      format: v1
      compatibility: *id003
      exact:
        files: *id004
        environment: []
        source: true
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_DIR: /scope/cache/cargo-target
      SCOPE_TEST_DATABASE_URL: postgres://scope:scope@127.0.0.1:5432/scope_test
      SCOPE_CACHE_EXPERIMENT_MODE: content
      SCOPE_DB_EXPERIMENT_MODE: baseline
    steps:
    - name: Measure backend cache and test setup
      run: 'service postgresql start

        su postgres -c "psql --set=ON_ERROR_STOP=1 --command=\"CREATE ROLE scope LOGIN
        CREATEDB PASSWORD ''scope''\""

        su postgres -c "createdb --owner=scope scope_test"

        node dev/cache-db-experiment/run.mjs'
  template:
    timeout: 45m
    caches:
    - name: cargo
      path: /scope/cache/cargo
      format: v1
      compatibility: &id005
        files:
        - rust-toolchain.toml
        environment:
        - RUSTUP_TOOLCHAIN
        - CARGO_INCREMENTAL
        - CARGO_PROFILE_DEV_DEBUG
        - CARGO_PROFILE_TEST_DEBUG
        source: false
      exact:
        files: &id006
        - Cargo.lock
        - Cargo.toml
        - api/Cargo.toml
        - cache-service/Cargo.toml
        - crates/scope-api-contract/Cargo.toml
        - crates/scope-cache-contract/Cargo.toml
        - crates/scope-cache-domain/Cargo.toml
        - crates/scope-content-lifecycle/Cargo.toml
        - crates/scope-domain/Cargo.toml
        - crates/scope-git-process/Cargo.toml
        - crates/scope-git/Cargo.toml
        - crates/scope-object-store/Cargo.toml
        - crates/scope-postgres/Cargo.toml
        - crates/scope-run-config/Cargo.toml
        - runner-runtime/Cargo.toml
        - worker/Cargo.toml
        environment: []
        source: false
    - name: cargo-target
      path: /scope/cache/cargo-target
      format: v1
      compatibility: *id005
      exact:
        files: *id006
        environment: []
        source: true
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_TARGET_DIR: /scope/cache/cargo-target
      SCOPE_TEST_DATABASE_URL: postgres://scope:scope@127.0.0.1:5432/scope_test
      SCOPE_CACHE_EXPERIMENT_MODE: content
      SCOPE_DB_EXPERIMENT_MODE: template
    steps:
    - name: Measure backend cache and test setup
      run: 'service postgresql start

        su postgres -c "psql --set=ON_ERROR_STOP=1 --command=\"CREATE ROLE scope LOGIN
        CREATEDB PASSWORD ''scope''\""

        su postgres -c "createdb --owner=scope scope_test"

        node dev/cache-db-experiment/run.mjs'
