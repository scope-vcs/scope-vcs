name: Install PostgreSQL clients
description: Put pinned PostgreSQL 18 pg_dump, pg_restore and psql commands on PATH.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        client_bin="$RUNNER_TEMP/postgres-client-bin"
        mkdir -p "$client_bin"
        docker pull --quiet postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
        for command in pg_dump pg_restore psql; do
          cat > "$client_bin/$command" <<'CLIENT'
        #!/usr/bin/env bash
        set -euo pipefail
        exec docker run --rm -i --network host --user "$(id -u):$(id -g)" \
          -v "$RUNNER_TEMP:$RUNNER_TEMP" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
          -w "$PWD" --entrypoint "${0##*/}" \
          postgres:18.6@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae "$@"
        CLIENT
          chmod 0755 "$client_bin/$command"
        done
        echo "$client_bin" >> "$GITHUB_PATH"
