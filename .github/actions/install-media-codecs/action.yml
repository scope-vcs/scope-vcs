name: Install media codecs
description: Install ffmpeg and libheif from packages cached per runner image, saving them for later runs.
runs:
  using: composite
  steps:
    - id: runner-image
      shell: bash
      run: echo "version=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"

    - id: restore
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/media-codec-debs
        key: media-codec-debs-${{ steps.runner-image.outputs.version }}

    - shell: bash
      run: |
        packages="$HOME/.cache/media-codec-debs"
        mkdir -p "$packages"
        if compgen -G "$packages/*.deb" > /dev/null; then
          sudo cp "$packages"/*.deb /var/cache/apt/archives/
        fi
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends ffmpeg libheif-examples
        if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then
          cp /var/cache/apt/archives/*.deb "$packages"/
        fi
        ffprobe -version
        heif-convert --version

    - if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ~/.cache/media-codec-debs
        key: media-codec-debs-${{ steps.runner-image.outputs.version }}
