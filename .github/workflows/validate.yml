name: Validate selected components

on:
  workflow_call:
    inputs:
      backend:
        type: string
        default: "false"
      web:
        type: string
        default: "false"
      cli:
        type: string
        default: "false"
      cli_distribution:
        type: string
        default: "false"
      media_smoke:
        type: string
        default: "false"
      validate_server:
        type: boolean
        default: true
      release_sha:
        type: string
        required: true
      reuse_artifacts:
        type: boolean
        default: false
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  server-validation:
    name: Server validation
    if: inputs.validate_server
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/validate-server.yml
    with:
      backend: ${{ inputs.backend }}
      web: ${{ inputs.web }}
      release_sha: ${{ inputs.release_sha }}
      release: ${{ inputs.release }}
      reuse_artifacts: ${{ inputs.reuse_artifacts }}
    secrets: inherit

  cli-validation:
    name: CLI validation
    if: ${{ !inputs.reuse_artifacts && inputs.cli == 'true' }}
    uses: ./.github/workflows/scope-cli-build.yml
    with:
      validate_targets: >-
        ${{ (inputs.release) ||
        (inputs.cli_distribution == 'true' &&
        ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/scope/')) ||
        (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))) }}
      validate_service_release: ${{ inputs.release }}
      distribution_mode: ${{ inputs.release && 'release' || 'pull-request' }}
    secrets: inherit

  integration-validation:
    name: Integration validation
    if: ${{ !inputs.reuse_artifacts && (inputs.web == 'true' || inputs.cli == 'true' || inputs.media_smoke == 'true') }}
    uses: ./.github/workflows/scope-integration-ci.yml
    with:
      run_web: ${{ inputs.web == 'true' }}
      run_cli: ${{ inputs.cli == 'true' }}
      run_media_smoke: ${{ inputs.media_smoke == 'true' }}
    secrets: inherit

  dependency-advisories:
    name: Dependency advisories
    if: ${{ inputs.release && !inputs.reuse_artifacts }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.100.0

      - name: Enable pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.1.0

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26

      - name: Install cargo tools
        run: ./dev/install-cargo-tools.sh

      - name: Check dependency advisories
        run: node .github/scripts/main-advisories.mjs "$RUNNER_TEMP/dependency-advisories.json"

  production-validation-gate:
    name: Production validation gate
    needs:
      - server-validation
      - cli-validation
      - integration-validation
      - dependency-advisories
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject cancelled validation
        if: ${{ cancelled() }}
        run: exit 1

      - name: Require selected validations to succeed
        env:
          VALIDATIONS_PASSED: >-
            ${{ inputs.reuse_artifacts || (
            (!inputs.release || needs.dependency-advisories.result == 'success') &&
            (!inputs.validate_server || needs.server-validation.result == 'success') &&
            (inputs.cli != 'true' || needs.cli-validation.result == 'success') &&
            ((inputs.web != 'true' && inputs.cli != 'true' && inputs.media_smoke != 'true') ||
            needs.integration-validation.result == 'success')) }}
        run: |
          test "$VALIDATIONS_PASSED" = true
          echo 'All selected production validations passed.'
