name: Validate selected components

on:
  workflow_call:
    inputs:
      checks_image:
        type: string
        default: "false"
      backend:
        type: string
        default: "false"
      web:
        type: string
        default: "false"
      cli:
        type: string
        default: "false"
      cli_distribution:
        type: string
        default: "false"
      validate_server:
        type: boolean
        default: true
      release_sha:
        type: string
        required: true
      reuse_artifacts:
        type: boolean
        default: false
      release:
        type: boolean
        default: false
    outputs:
      media_worker_image:
        value: ${{ jobs.server-validation.outputs.media_worker_image }}

permissions:
  contents: read

jobs:
  checks-image:
    name: Checks image
    if: ${{ !inputs.reuse_artifacts && inputs.checks_image == 'true' }}
    permissions:
      contents: read
      deployments: write
      id-token: write
      packages: write
    uses: ./.github/workflows/scope-checks-image.yml
    with:
      publish: ${{ inputs.release }}
    secrets: inherit

  server-validation:
    name: Server validation
    if: inputs.validate_server
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/validate-server.yml
    with:
      backend: ${{ inputs.backend }}
      web: ${{ inputs.web }}
      release_sha: ${{ inputs.release_sha }}
      release: ${{ inputs.release }}
      reuse_artifacts: ${{ inputs.reuse_artifacts }}
    secrets: inherit

  cli-validation:
    name: CLI validation
    if: ${{ !inputs.reuse_artifacts && inputs.cli == 'true' }}
    uses: ./.github/workflows/scope-cli-build.yml
    with:
      validate_targets: >-
        ${{ (inputs.release) ||
        (inputs.cli_distribution == 'true' &&
        (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))) }}
      validate_service_release: ${{ inputs.release }}
    secrets: inherit

  integration-validation:
    name: Integration validation
    if: ${{ !inputs.reuse_artifacts && (inputs.web == 'true' || inputs.cli == 'true') }}
    uses: ./.github/workflows/scope-integration-ci.yml
    with:
      run_web: ${{ inputs.web == 'true' }}
      run_cli: ${{ inputs.cli == 'true' }}
    secrets: inherit

  production-validation-gate:
    name: Production validation gate
    needs:
      - checks-image
      - server-validation
      - cli-validation
      - integration-validation
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Reject cancelled validation
        if: ${{ cancelled() }}
        run: exit 1

      - name: Require selected validations to succeed
        env:
          VALIDATIONS_PASSED: >-
            ${{ inputs.reuse_artifacts || (
            (inputs.checks_image != 'true' || needs.checks-image.result == 'success') &&
            (!inputs.validate_server || needs.server-validation.result == 'success') &&
            (inputs.cli != 'true' || needs.cli-validation.result == 'success') &&
            ((inputs.web != 'true' && inputs.cli != 'true') ||
            needs.integration-validation.result == 'success')) }}
        run: |
          test "$VALIDATIONS_PASSED" = true
          echo 'All selected production validations passed.'
