name: Backup monitor

on:
  schedule:
    - cron: '7 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-backup-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check schedules and latest completed production backup
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: node deploy/scripts/check-production-backups.mjs
