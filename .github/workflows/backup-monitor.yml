name: Backup monitor

# Dispatched hourly by the scope-backup-monitor-hourly EventBridge rule in
# deploy/aws/backup-monitor.yaml. GitHub cron drops scheduled runs.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-backup-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/backup-monitor-execute.yml
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
