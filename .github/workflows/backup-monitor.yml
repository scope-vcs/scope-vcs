name: Backup monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-backup-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/backup-monitor-execute.yml
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
