name: Backup monitor

# GitHub drops most scheduled runs. The alarm needs one heartbeat per hour, so
# attempt every fifteen minutes and avoid the congested top of the hour.
on:
  schedule:
    - cron: '7-52/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-backup-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/backup-monitor-execute.yml
    secrets:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
