name: AWS infrastructure

on:
  workflow_dispatch:
    inputs:
      command:
        description: CloudFormation operation
        type: choice
        default: plan
        options:
          - validate
          - plan
          - apply
      change_set_arn:
        description: Exact change-set ARN to apply; leave empty to create a fresh plan
        type: string
        required: false

concurrency:
  group: scope-aws-infrastructure
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  infrastructure:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/scope-aws-infrastructure-execute.yml
    with:
      command: ${{ inputs.command }}
      change_set_arn: ${{ inputs.change_set_arn }}
