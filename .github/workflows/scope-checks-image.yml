name: Publish checks image

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

permissions:
  contents: read

env:
  ECR_REPOSITORY: scope-vcs/production/checks
  GHCR_IMAGE_NAME: ghcr.io/${{ github.repository }}/checks
  SOCI_ARCHIVE_SHA256: 1c9d3bb74dd4fc1355fbea478c62e30d50ede062c54f4008a9e3516877fdfee3
  SOCI_VERSION: 0.15.0

jobs:
  validate:
    name: Validate checks image
    if: github.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Git build version
        id: git
        run: |
          echo "version=$(jq -er '.git.version' dev/tool-versions.json)" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$(jq -er '.git.sourceSha256' dev/tool-versions.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: .scope/images/checks/Dockerfile

      - name: Build candidate image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: .scope/images/checks/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: false
          load: true
          tags: scope-checks:candidate
          build-args: |
            GIT_VERSION=${{ steps.git.outputs.version }}
            GIT_SOURCE_SHA256=${{ steps.git.outputs.source_sha256 }}

      - name: Verify runtime process lifecycle
        run: dev/checks/runner-runtime-container --image scope-checks:candidate

      - name: Scan candidate executable image
        run: .scope/images/checks/scan-image.sh docker scope-checks:candidate checks-image-scan.json

      - name: Retain vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checks-image-scan-candidate
          path: checks-image-scan.json
          if-no-files-found: warn

  build:
    name: Build checks image
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      deployments: write
      id-token: write
      packages: write
    steps:
      - name: Decide whether to publish
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          publish=false
          if [[ "$REQUESTED_PUBLISH" == "true" && "$EVENT_NAME" != "pull_request" && "$GIT_REF" == "refs/heads/main" ]]; then
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Verify checked out revision
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Read Git build version
        id: git
        run: |
          echo "version=$(jq -er '.git.version' dev/tool-versions.json)" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$(jq -er '.git.sourceSha256' dev/tool-versions.json)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: steps.source.outputs.publish == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.SCOPE_CHECKS_IMAGE_AWS_ROLE_ARN }}
          role-session-name: scope-checks-image-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        if: steps.source.outputs.publish == 'true'
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Prepare image tags
        id: tags
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          PUBLISH: ${{ steps.source.outputs.publish }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          ghcr_tag="sha-${SOURCE_SHA}"
          unique_suffix="${SOURCE_SHA}-${RUN_ID}-${RUN_ATTEMPT}"
          {
            echo "tags<<EOF"
            echo "${GHCR_IMAGE_NAME}:${ghcr_tag}"
            echo "EOF"
            echo "ghcr_image=${GHCR_IMAGE_NAME}:${ghcr_tag}"
            if [[ "$PUBLISH" == "true" ]]; then
              test -n "$ECR_REGISTRY"
              echo "raw_tag=raw-${unique_suffix}"
              echo "raw_image=${ECR_REGISTRY}/${ECR_REPOSITORY}:raw-${unique_suffix}"
              echo "soci_tag=soci-${unique_suffix}"
              echo "soci_image=${ECR_REGISTRY}/${ECR_REPOSITORY}:soci-${unique_suffix}"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: .scope/images/checks/Dockerfile

      - name: Log in to the GitHub container registry
        if: steps.source.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for verification
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: .scope/images/checks/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: false
          load: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            GIT_VERSION=${{ steps.git.outputs.version }}
            GIT_SOURCE_SHA256=${{ steps.git.outputs.source_sha256 }}

      - name: Verify runtime process lifecycle
        env:
          IMAGE: ${{ steps.tags.outputs.ghcr_image }}
        run: dev/checks/runner-runtime-container --image "$IMAGE"

      - name: Scan verified executable image before publishing
        env:
          IMAGE: ${{ steps.tags.outputs.ghcr_image }}
        run: .scope/images/checks/scan-image.sh docker "$IMAGE" checks-image-scan.json

      - name: Publish verified image
        id: image
        if: steps.source.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.tags.outputs.ghcr_image }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$TAGS"
          digest="$(docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' \
            | jq -er --arg prefix "${IMAGE%:*}@" '.[] | select(startswith($prefix)) | ltrimstr($prefix)')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install SOCI publishing tools
        if: steps.source.outputs.publish == 'true'
        shell: bash
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes skopeo
          fi
          skopeo --version | tee -a "$GITHUB_STEP_SUMMARY"
          archive="soci-snapshotter-${SOCI_VERSION}-linux-amd64-static.tar.gz"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/awslabs/soci-snapshotter/releases/download/v${SOCI_VERSION}/$archive"
          echo "${SOCI_ARCHIVE_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" soci
          sudo install --mode 0755 "$RUNNER_TEMP/soci" /usr/local/bin/soci

      - name: Publish raw and SOCI v2 variants to Amazon ECR
        if: steps.source.outputs.publish == 'true'
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          RAW_IMAGE: ${{ steps.tags.outputs.raw_image }}
          RAW_TAG: ${{ steps.tags.outputs.raw_tag }}
          SOCI_IMAGE: ${{ steps.tags.outputs.soci_image }}
          SOCI_TAG: ${{ steps.tags.outputs.soci_tag }}
        run: >-
          .github/scripts/publish-soci-image.sh
          "$GHCR_IMAGE"
          "$RAW_IMAGE"
          "$SOCI_IMAGE"
          "$ECR_REPOSITORY"
          "$RAW_TAG"
          "$SOCI_TAG"

      - name: Retain vulnerability reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checks-image-scans
          path: |
            checks-image-scan.json
            checks-image-soci-scan.json
          if-no-files-found: warn

      - name: Promote scanned image to main
        if: steps.source.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.tags.outputs.ghcr_image }}
        run: |
          docker tag "$IMAGE" "${GHCR_IMAGE_NAME}:main"
          docker push "${GHCR_IMAGE_NAME}:main"

      - name: Record published digest
        id: published
        if: steps.source.outputs.publish == 'true'
        env:
          GHCR_DIGEST: ${{ steps.image.outputs.digest }}
          GHCR_IMAGE: ${{ steps.tags.outputs.ghcr_image }}
          RAW_IMAGE: ${{ steps.tags.outputs.raw_image }}
          RAW_TAG: ${{ steps.tags.outputs.raw_tag }}
          SOCI_IMAGE: ${{ steps.tags.outputs.soci_image }}
          SOCI_TAG: ${{ steps.tags.outputs.soci_tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          raw_digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$RAW_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          soci_digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$SOCI_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "$GHCR_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$raw_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$soci_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "Published one image as three startup variants:"
            echo
            echo "- GHCR: \`${GHCR_IMAGE}@${GHCR_DIGEST}\`"
            echo "- ECR: \`${RAW_IMAGE}@${raw_digest}\`"
            echo "- ECR + SOCI v2: \`${SOCI_IMAGE}@${soci_digest}\`"
            echo
            echo "Source commit: \`${SOURCE_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "digest=${soci_digest}" >> "$GITHUB_OUTPUT"
          printf '%s\n' \
            "source_sha=$SOURCE_SHA" \
            "ghcr_image=$GHCR_IMAGE@$GHCR_DIGEST" \
            "raw_ecr_image=$RAW_IMAGE@$raw_digest" \
            "soci_ecr_image=$SOCI_IMAGE@$soci_digest" \
            > checks-image.txt

      - name: Upload published image reference
        if: steps.source.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checks-image-${{ github.sha }}
          path: checks-image.txt
          if-no-files-found: error

      - name: Record successful production revision
        if: steps.source.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.published.outputs.digest }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: >-
          node .github/scripts/production-deployment-progress.mjs record
          --component checks-image
          --source-sha "$SOURCE_SHA"
          --provider ecr
          --evidence-id "$IMAGE_DIGEST"
          --log-url "$LOG_URL"
