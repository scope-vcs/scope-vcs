name: Prepare smoke tools

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      source_run_id:
        type: string
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build smoke tools
    if: inputs.source_run_id == ''
    permissions:
      contents: read
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Validate requested revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "${#SOURCE_SHA}" = 40 && [[ "$SOURCE_SHA" != *[^0-9a-f]* ]]

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: staging-smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            cli -> target

      - name: Build smoke binaries
        env:
          SCOPE_BUILD_SHA: ${{ inputs.source_sha }}
        run: |
          mkdir -p artifacts/commands
          cargo build --release --locked -p api --bin scope-smoke-seed --features smoke-seed
          cargo build --release --locked --manifest-path cli/Cargo.toml --bin scope
          install -m 0755 target/release/scope-smoke-seed artifacts/commands/scope-smoke-seed
          install -m 0755 cli/target/release/scope artifacts/commands/scope
          tar -czf artifacts/staging-commands.tar.gz -C artifacts/commands .
          node .github/scripts/smoke-tools-evidence.mjs create artifacts "$SCOPE_BUILD_SHA" rust-toolchain.toml

      - name: Upload staging commands
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-commands-${{ inputs.source_sha }}
          path: |
            artifacts/staging-commands.tar.gz
            artifacts/staging-commands.json
          if-no-files-found: error
          retention-days: 90

  reuse:
    name: Reuse verified smoke tools
    if: inputs.source_run_id != ''
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read original source toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          persist-credentials: false
          sparse-checkout: rust-toolchain.toml
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: staging-commands-${{ inputs.source_sha }}
          path: artifacts
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Verify source, toolchain and archive digest
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: node .github/scripts/smoke-tools-evidence.mjs verify artifacts "$SOURCE_SHA" candidate/rust-toolchain.toml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-commands-${{ inputs.source_sha }}
          path: |
            artifacts/staging-commands.tar.gz
            artifacts/staging-commands.json
          if-no-files-found: error
          retention-days: 90
