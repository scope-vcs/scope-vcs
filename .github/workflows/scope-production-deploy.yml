name: Scope CI and Production Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_staging_rehearsal:
        description: Deploy directly after validation and artifact preparation; omit the staging rehearsal
        type: boolean
        default: false
      maintenance_budget_seconds:
        description: Approved staging-derived outage budget; 0 prevents a new maintenance cutover
        type: number
        default: 0
      recover_source_sha:
        description: Exact source SHA recorded by the interrupted cutover
        type: string
        default: ""
      recover_cutover_id:
        description: Interrupted cutover deployment ID; reuse its revision and artifacts
        type: string
        default: ""
      scope:
        description: Component to validate and deploy
        type: choice
        default: all
        options:
          - all
          - checksImage
          - cache
          - worker
          - mediaWorker
          - router
          - media
          - api
          - web
          - cli

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' &&
    format('scope-ci-pr-{0}', github.event.pull_request.number) ||
    (github.ref == 'refs/heads/main' &&
    'scope-production-deploy' ||
    format('scope-candidate-{0}', github.ref_name)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  plan:
    name: Plan selected components
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      release_sha: ${{ steps.release.outputs.sha }}
      deployed_revisions: ${{ steps.progress.outputs.revisions }}
      deployed_components: ${{ steps.progress.outputs.deployments }}
      checks_image: ${{ steps.plan.outputs.checks_image }}
      cache: ${{ steps.plan.outputs.cache }}
      worker: ${{ steps.plan.outputs.worker }}
      media_worker: ${{ steps.plan.outputs.media_worker }}
      router: ${{ steps.plan.outputs.router }}
      media: ${{ steps.plan.outputs.media }}
      api: ${{ steps.plan.outputs.api }}
      web: ${{ steps.plan.outputs.web }}
      cli: ${{ steps.plan.outputs.cli }}
      cli_distribution: ${{ steps.plan.outputs.cli_distribution }}
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select immutable release revision
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECOVER_ID: ${{ inputs.recover_cutover_id || '' }}
          RECOVER_SHA: ${{ inputs.recover_source_sha || '' }}
        run: |
          if [[ -n "$RECOVER_ID" ]]; then
            [[ "$RECOVER_ID" =~ ^[0-9]+$ && "$RECOVER_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'Recovery requires a numeric cutover ID and its exact source SHA.' >&2
              exit 2
            }
            test "$GITHUB_REF" = refs/heads/main
            node .github/scripts/production-deployment-progress.mjs cutover-validate-recovery \
              --id "$RECOVER_ID" --source-sha "$RECOVER_SHA" >/dev/null
            echo "sha=$RECOVER_SHA" >> "$GITHUB_OUTPUT"
          else
            test -z "$RECOVER_SHA"
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Read successful production revisions
        id: progress
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/production-deployment-progress.mjs read

      - name: Select affected components
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUESTED_SCOPE: ${{ inputs.recover_cutover_id != '' && 'api' || (github.event_name == 'workflow_dispatch' && inputs.scope || 'changed') }}
          DEPLOYED_REVISIONS: ${{ steps.progress.outputs.revisions }}
        run: >-
          node .github/scripts/plan-production-deployment.mjs
          --manifest .github/deployment-services.json
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --scope "$REQUESTED_SCOPE"
          --deployed-revisions "$DEPLOYED_REVISIONS"

      - name: Install Rust for dependency metadata
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Check repository policy
        run: ./dev/checks/policy

      - name: Check operations
        run: ./dev/checks/ops

  checks-image:
    name: Checks image
    needs: plan
    if: needs.plan.outputs.checks_image == 'true'
    permissions:
      contents: read
      deployments: write
      id-token: write
      packages: write
    uses: ./.github/workflows/scope-checks-image.yml
    with:
      publish: ${{ github.event_name != 'pull_request' }}
      source_sha: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.scope == 'checksImage' && github.sha || '' }}
    secrets: inherit

  staging-proof:
    name: Railway staging proof
    needs: checks-image
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref != 'refs/heads/main' &&
      inputs.scope == 'checksImage' &&
      needs.checks-image.result == 'success'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch trusted staging proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          run_title="Scope staging $SOURCE_SHA"
          seen_run_ids="$(
            gh run list \
              --workflow scope-railway-staging.yml \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,displayTitle \
              | jq -c --arg title "$run_title" \
                '[.[] | select(.displayTitle == $title) | .databaseId]'
          )"
          gh workflow run scope-railway-staging.yml --ref main -f source_sha="$SOURCE_SHA"
          for _ in {1..60}; do
            run_id="$(
              gh run list \
                --workflow scope-railway-staging.yml \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,displayTitle \
                | jq -r --arg title "$run_title" --argjson seen "$seen_run_ids" \
                  '.[] | select(.displayTitle == $title) | select(.databaseId as $id | $seen | index($id) | not) | .databaseId' \
                | head -n 1 \
                || true
            )"
            if [[ -n "$run_id" ]]; then
              gh run watch "$run_id" --exit-status
              exit
            fi
            sleep 5
          done
          echo "Timed out locating the trusted staging proof for $SOURCE_SHA." >&2
          exit 1

  backend-validation:
    name: Backend validation
    needs: plan
    if: >-
      inputs.recover_cutover_id == '' &&
      (needs.plan.outputs.cache == 'true' ||
      needs.plan.outputs.worker == 'true' ||
      needs.plan.outputs.media_worker == 'true' ||
      needs.plan.outputs.router == 'true' ||
      needs.plan.outputs.media == 'true' ||
      needs.plan.outputs.api == 'true')
    uses: ./.github/workflows/scope-api-ci.yml
    with:
      build_release_artifact: ${{ github.event_name != 'pull_request' }}
      build_router_release: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  media-worker-image:
    name: Media worker image
    needs: plan
    if: >-
      inputs.recover_cutover_id == '' && (
      needs.plan.outputs.cache == 'true' ||
      needs.plan.outputs.worker == 'true' ||
      needs.plan.outputs.media_worker == 'true' ||
      needs.plan.outputs.router == 'true' ||
      needs.plan.outputs.media == 'true' ||
      needs.plan.outputs.api == 'true')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/scope-media-worker-image.yml
    with:
      publish: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      source_sha: ${{ needs.plan.outputs.release_sha }}
    secrets: inherit

  web-validation:
    name: Web validation
    needs: plan
    if: inputs.recover_cutover_id == '' && (needs.plan.outputs.web == 'true')
    uses: ./.github/workflows/scope-web-ci.yml
    with:
      build_release_artifact: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  cli-validation:
    name: CLI validation
    needs: plan
    if: inputs.recover_cutover_id == '' && (needs.plan.outputs.cli == 'true')
    uses: ./.github/workflows/scope-cli-build.yml
    with:
      validate_targets: >-
        ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
        (needs.plan.outputs.cli_distribution == 'true' &&
        (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.actor != 'dependabot[bot]'))) }}
      validate_service_release: ${{ github.event_name != 'pull_request' }}
    secrets: inherit

  integration-validation:
    name: Integration validation
    needs: plan
    if: inputs.recover_cutover_id == '' && (needs.plan.outputs.web == 'true' || needs.plan.outputs.cli == 'true')
    uses: ./.github/workflows/scope-integration-ci.yml
    with:
      run_web: ${{ needs.plan.outputs.web == 'true' }}
      run_cli: ${{ needs.plan.outputs.cli == 'true' }}
    secrets: inherit

  production-validation-gate:
    name: Production validation gate
    needs:
      - plan
      - checks-image
      - backend-validation
      - media-worker-image
      - web-validation
      - cli-validation
      - integration-validation
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.plan.result == 'success' &&
      (inputs.recover_cutover_id != '' || (
      (needs.plan.outputs.checks_image != 'true' || needs.checks-image.result == 'success') &&
      ((needs.plan.outputs.cache != 'true' &&
      needs.plan.outputs.worker != 'true' &&
      needs.plan.outputs.media_worker != 'true' &&
      needs.plan.outputs.router != 'true' &&
      needs.plan.outputs.media != 'true' &&
      needs.plan.outputs.api != 'true') ||
      (needs.backend-validation.result == 'success' &&
      needs.media-worker-image.result == 'success')) &&
      (needs.plan.outputs.web != 'true' || needs.web-validation.result == 'success') &&
      (needs.plan.outputs.cli != 'true' || needs.cli-validation.result == 'success') &&
      ((needs.plan.outputs.web != 'true' && needs.plan.outputs.cli != 'true') ||
      needs.integration-validation.result == 'success')))
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - run: echo 'All selected production validations passed.'

  release-preparation:
    name: Prepare Railway artifacts
    needs: [plan, production-validation-gate, media-worker-image]
    if: >-
      !cancelled() &&
      (needs.media-worker-image.result == 'success' || inputs.recover_cutover_id != '') &&
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.production-validation-gate.result == 'success' &&
      (needs.plan.outputs.cache == 'true' || needs.plan.outputs.worker == 'true' ||
      needs.plan.outputs.media_worker == 'true' || needs.plan.outputs.router == 'true' ||
      needs.plan.outputs.media == 'true' || needs.plan.outputs.api == 'true' ||
      needs.plan.outputs.web == 'true')
    permissions:
      actions: read
      contents: read
      deployments: read
      packages: write
    uses: ./.github/workflows/scope-release-prepare.yml
    with:
      source_sha: ${{ needs.plan.outputs.release_sha }}
      prepare_backend: >-
        ${{ needs.plan.outputs.cache == 'true' || needs.plan.outputs.worker == 'true' ||
        needs.plan.outputs.media_worker == 'true' || needs.plan.outputs.router == 'true' ||
        needs.plan.outputs.media == 'true' || needs.plan.outputs.api == 'true' }}
      prepare_router: >-
        ${{ needs.plan.outputs.cache == 'true' || needs.plan.outputs.worker == 'true' ||
        needs.plan.outputs.media_worker == 'true' || needs.plan.outputs.router == 'true' ||
        needs.plan.outputs.media == 'true' || needs.plan.outputs.api == 'true' }}
      prepare_web: ${{ needs.plan.outputs.web == 'true' }}
      recover_cutover_id: ${{ inputs.recover_cutover_id || '' }}
      media_worker_image: ${{ needs.media-worker-image.outputs.image_ref || '' }}
    secrets: inherit

  release-staging-proof:
    name: Prove prepared release in staging
    needs: [plan, release-preparation]
    if: >-
      !cancelled() && inputs.recover_cutover_id == '' &&
      !(github.event_name == 'workflow_dispatch' && inputs.skip_staging_rehearsal == true) &&
      needs.release-preparation.result == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch and await exact artifact rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.plan.outputs.release_sha }}
        run: |
          proof_id="$(cat /proc/sys/kernel/random/uuid)"
          title="Scope staging $SOURCE_SHA / $proof_id"
          seen="$(gh run list --workflow scope-railway-staging.yml --event workflow_dispatch \
            --limit 100 --json databaseId | jq -c '[.[].databaseId]')"
          gh workflow run scope-railway-staging.yml --ref main \
            -f source_sha="$SOURCE_SHA" -f prepared_run_id="$GITHUB_RUN_ID" -f proof_request_id="$proof_id"
          for _ in {1..60}; do
            id="$(gh run list --workflow scope-railway-staging.yml --event workflow_dispatch \
              --limit 100 --json databaseId,displayTitle | jq -r --arg title "$title" --argjson seen "$seen" \
              '[.[] | select(.displayTitle == $title) | select(.databaseId as $id | $seen | index($id) | not)][0].databaseId // empty')"
            if [[ -n "$id" ]]; then
              gh run watch "$id" --exit-status
              exit
            fi
            sleep 5
          done
          echo 'Could not locate the exact prepared release staging rehearsal.' >&2
          exit 1

  backend-deploy:
    name: Backend deploy
    needs: [plan, production-validation-gate, release-preparation, release-staging-proof]
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.production-validation-gate.result == 'success' &&
      needs.release-preparation.result == 'success' &&
      (inputs.recover_cutover_id != '' || needs.release-staging-proof.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.skip_staging_rehearsal == true)) &&
      (needs.plan.outputs.cache == 'true' ||
      needs.plan.outputs.worker == 'true' ||
      needs.plan.outputs.media_worker == 'true' ||
      needs.plan.outputs.router == 'true' ||
      needs.plan.outputs.media == 'true' ||
      needs.plan.outputs.api == 'true')
    permissions:
      actions: read
      contents: read
      deployments: write
    uses: ./.github/workflows/scope-api-deploy.yml
    with:
      source_sha: ${{ needs.plan.outputs.release_sha }}
      deploy_cache: ${{ needs.plan.outputs.cache == 'true' }}
      deploy_worker: ${{ needs.plan.outputs.worker == 'true' }}
      deploy_media_worker: ${{ needs.plan.outputs.media_worker == 'true' }}
      deploy_router: ${{ needs.plan.outputs.router == 'true' }}
      deploy_media: ${{ needs.plan.outputs.media == 'true' }}
      deploy_api: ${{ needs.plan.outputs.api == 'true' }}
      successful_deployments: ${{ needs.plan.outputs.deployed_components || '{}' }}
      recover_cutover_id: ${{ inputs.recover_cutover_id || '' }}
      maintenance_budget_seconds: ${{ fromJSON(format('{0}', inputs.maintenance_budget_seconds || 0)) }}
    secrets: inherit

  web-deploy:
    name: Web deploy
    needs: [plan, production-validation-gate, release-preparation, release-staging-proof, backend-deploy]
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.production-validation-gate.result == 'success' &&
      needs.release-preparation.result == 'success' &&
      (inputs.recover_cutover_id != '' || needs.release-staging-proof.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.skip_staging_rehearsal == true)) &&
      needs.plan.outputs.web == 'true' &&
      (((needs.plan.outputs.cache == 'true' ||
      needs.plan.outputs.worker == 'true' ||
      needs.plan.outputs.media_worker == 'true' ||
      needs.plan.outputs.router == 'true' ||
      needs.plan.outputs.media == 'true' ||
      needs.plan.outputs.api == 'true') &&
      needs.backend-deploy.result == 'success') ||
      ((needs.plan.outputs.cache != 'true' &&
      needs.plan.outputs.worker != 'true' &&
      needs.plan.outputs.media_worker != 'true' &&
      needs.plan.outputs.router != 'true' &&
      needs.plan.outputs.media != 'true' &&
      needs.plan.outputs.api != 'true') &&
      needs.backend-deploy.result == 'skipped'))
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/scope-web-deploy.yml
    with:
      source_sha: ${{ needs.plan.outputs.release_sha }}
      verified_successful_sha: ${{ fromJSON(needs.plan.outputs.deployed_revisions || '{}').web || '' }}
    secrets: inherit

  cli-deploy:
    name: CLI deploy
    needs: [plan, production-validation-gate, backend-deploy]
    if: >-
      inputs.recover_cutover_id == '' &&
      !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.production-validation-gate.result == 'success' &&
      needs.plan.outputs.cli == 'true' &&
      (((needs.plan.outputs.cache == 'true' ||
      needs.plan.outputs.worker == 'true' ||
      needs.plan.outputs.media_worker == 'true' ||
      needs.plan.outputs.router == 'true' ||
      needs.plan.outputs.media == 'true' ||
      needs.plan.outputs.api == 'true') &&
      needs.backend-deploy.result == 'success') ||
      ((needs.plan.outputs.cache != 'true' &&
      needs.plan.outputs.worker != 'true' &&
      needs.plan.outputs.media_worker != 'true' &&
      needs.plan.outputs.router != 'true' &&
      needs.plan.outputs.media != 'true' &&
      needs.plan.outputs.api != 'true') &&
      needs.backend-deploy.result == 'skipped'))
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/scope-cli-deploy.yml
    with:
      verified_successful_sha: ${{ fromJSON(needs.plan.outputs.deployed_revisions || '{}').cli || '' }}
    secrets: inherit

  production-health-gate:
    name: Production Railway health gate
    needs: [plan, production-validation-gate, backend-deploy, web-deploy, cli-deploy]
    if: >-
      !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.production-validation-gate.result == 'success' &&
      (((needs.plan.outputs.cache == 'true' ||
      needs.plan.outputs.worker == 'true' ||
      needs.plan.outputs.media_worker == 'true' ||
      needs.plan.outputs.router == 'true' ||
      needs.plan.outputs.media == 'true' ||
      needs.plan.outputs.api == 'true') &&
      needs.backend-deploy.result == 'success') ||
      ((needs.plan.outputs.cache != 'true' &&
      needs.plan.outputs.worker != 'true' &&
      needs.plan.outputs.media_worker != 'true' &&
      needs.plan.outputs.router != 'true' &&
      needs.plan.outputs.media != 'true' &&
      needs.plan.outputs.api != 'true') &&
      needs.backend-deploy.result == 'skipped')) &&
      ((needs.plan.outputs.web == 'true' && needs.web-deploy.result == 'success') ||
      (needs.plan.outputs.web != 'true' && needs.web-deploy.result == 'skipped')) &&
      ((needs.plan.outputs.cli == 'true' && needs.cli-deploy.result == 'success') ||
      (needs.plan.outputs.cli != 'true' && needs.cli-deploy.result == 'skipped'))
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      deployments: read
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Read final production deployment evidence
        id: progress
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/production-deployment-progress.mjs read

      - name: Install Railway CLI
        run: |
          railway_cli_version="$(jq -r '.railway.cliVersion' .github/deployment-services.json)"
          npm install -g "@railway/cli@$railway_cli_version"

      - name: Verify exact live production deployments
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SCOPE_PRODUCTION_DEPLOYMENTS_JSON: ${{ steps.progress.outputs.deployments }}
        run: |
          manifest=.github/deployment-services.json
          project_id="$(jq -er '.railway.projectId' "$manifest")"
          environment_id="$(jq -er '.railway.environmentId' "$manifest")"
          services_json="$(
            railway status \
              --project "$project_id" \
              --environment "$environment_id" \
              --json
          )"
          SCOPE_DEPLOYMENT_MANIFEST_JSON="$(jq -c . "$manifest")" \
            SCOPE_RAILWAY_SERVICES_JSON="$services_json" \
            node .github/scripts/railway-service-health.mjs
