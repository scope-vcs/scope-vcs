name: Prepare release

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      prepare_backend:
        type: boolean
        default: false
      prepare_router:
        type: boolean
        default: false
      prepare_web:
        type: boolean
        default: false
      recover_cutover_id:
        type: string
        default: ""
      prepared_run_id:
        type: string
        default: ""
      media_worker_image:
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  packages: write
  deployments: read

jobs:
  prepare:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout trusted release orchestration
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore selected immutable release
        if: inputs.prepared_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: selected-release-${{ inputs.source_sha }}

      - name: Use validated release manifest
        if: inputs.prepared_run_id != ''
        run: mv selected-release.json prepared-release.json

      - name: Download backend binaries
        if: inputs.prepare_backend && inputs.prepared_run_id == ''
        uses: actions/download-artifact@v8
        with:
          name: backend-release-${{ inputs.source_sha }}
          path: artifacts/backend

      - name: Download web runtime
        if: inputs.prepare_web && inputs.prepared_run_id == ''
        uses: actions/download-artifact@v8
        with:
          name: web-release-${{ inputs.source_sha }}
          path: artifacts/web

      - name: Set up image builder
        if: inputs.prepared_run_id == ''
        uses: docker/setup-buildx-action@v3

      - name: Authenticate image publishing
        if: inputs.prepared_run_id == ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare immutable release images
        if: inputs.prepared_run_id == ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCOPE_DEPLOYMENT_SOURCE_SHA: ${{ inputs.source_sha }}
          SCOPE_MAINTENANCE_BINARY: artifacts/backend/bin/scope-maintenance
          PREPARE_BACKEND: ${{ inputs.prepare_backend && '1' || '0' }}
          PREPARE_ROUTER: ${{ inputs.prepare_router && '1' || '0' }}
          PREPARE_WEB: ${{ inputs.prepare_web && '1' || '0' }}
          MEDIA_WORKER_IMAGE: ${{ inputs.media_worker_image }}
          SCOPE_RAILWAY_REGISTRY_USERNAME: ${{ secrets.RAILWAY_REGISTRY_USERNAME }}
          SCOPE_RAILWAY_REGISTRY_PASSWORD: ${{ secrets.RAILWAY_REGISTRY_PASSWORD }}
        run: |
          [[ "$PREPARE_BACKEND" == 1 ]] || unset SCOPE_MAINTENANCE_BINARY
          preparation_failed=0
          if [[ "$PREPARE_BACKEND" == 1 ]]; then
            mkdir -p artifacts/backend/bin
            python3 .github/scripts/extract-railway-release.py backend artifacts/backend/backend-release.tar.gz artifacts/backend/bin
            components=(api run-worker cache media-api)
            [[ "$PREPARE_ROUTER" == 0 ]] || components+=(git-router)
            for component in "${components[@]}"; do
              root=".railway-prepared/$component"
              mkdir -p "$root/bin"
              cp artifacts/backend/bin/LICENSE artifacts/backend/bin/NOTICE artifacts/backend/bin/third-party-rust.txt "$root/bin/"
              case "$component" in
                api) binary=scope-vcs ;;
                run-worker) binary=scope-worker ;;
                cache) binary=scope-cache-service ;;
                git-router) binary=scope-repo-router ;;
                media-api) binary=scope-media-service ;;
              esac
              install -m 0755 "artifacts/backend/bin/$binary" "$root/bin/$binary"
              if [[ "$component" == api ]]; then
                install -m 0755 "$SCOPE_MAINTENANCE_BINARY" "$root/bin/scope-maintenance"
              fi
              if ! bash .github/scripts/prepare-railway-artifact.sh "$component" "$root" prepared-release.json; then
                preparation_failed=1
              fi
            done
            [[ "$MEDIA_WORKER_IMAGE" =~ ^ghcr\.io/scope-vcs/scope-media-worker@sha256:[0-9a-f]{64}$ ]]
            media_worker_service="$(jq -er '.services["media-worker"].id' .github/deployment-services.json)"
            node .github/scripts/railway-artifact.mjs record prepared-release.json \
              media-worker "$MEDIA_WORKER_IMAGE" "$SCOPE_DEPLOYMENT_SOURCE_SHA" "$media_worker_service"
          fi
          if [[ "$PREPARE_WEB" == 1 ]]; then
            mkdir -p .railway-prepared/web
            python3 .github/scripts/extract-railway-release.py web artifacts/web/web-release.tar.gz .railway-prepared/web
            if ! bash .github/scripts/prepare-railway-artifact.sh web .railway-prepared/web prepared-release.json; then
              preparation_failed=1
            fi
          fi
          [[ "$preparation_failed" == 0 ]]
          test -s prepared-release.json

      - name: Upload immutable release manifest
        uses: actions/upload-artifact@v7
        with:
          name: prepared-release-${{ inputs.source_sha }}
          path: prepared-release.json
          if-no-files-found: error
          retention-days: 90
