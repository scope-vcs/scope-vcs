name: Prepare release

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      prepare_backend:
        type: boolean
        default: false
      prepare_router:
        type: boolean
        default: false
      prepare_web:
        type: boolean
        default: false
      recover_cutover_id:
        type: string
        default: ""
      prepared_run_id:
        type: string
        default: ""
      media_worker_image:
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  packages: write
  deployments: read

jobs:
  prepare:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout trusted release orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Restore selected immutable release
        if: inputs.prepared_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: selected-release-${{ inputs.source_sha }}

      - name: Use validated release manifest
        if: inputs.prepared_run_id != ''
        run: mv selected-release.json prepared-release.json

      - name: Download backend binaries
        if: inputs.prepare_backend && inputs.prepared_run_id == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-release-${{ inputs.source_sha }}
          path: artifacts/backend

      - name: Download web runtime
        if: inputs.prepare_web && inputs.prepared_run_id == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-release-${{ inputs.source_sha }}
          path: artifacts/web

      - name: Set up image builder
        if: inputs.prepared_run_id == ''
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Authenticate image publishing
        if: inputs.prepared_run_id == ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare immutable release images
        if: inputs.prepared_run_id == ''
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCOPE_DEPLOYMENT_SOURCE_SHA: ${{ inputs.source_sha }}
          SCOPE_MAINTENANCE_BINARY: artifacts/backend/bin/scope-maintenance
          PREPARE_BACKEND: ${{ inputs.prepare_backend && '1' || '0' }}
          PREPARE_ROUTER: ${{ inputs.prepare_router && '1' || '0' }}
          PREPARE_WEB: ${{ inputs.prepare_web && '1' || '0' }}
          MEDIA_WORKER_IMAGE: ${{ inputs.media_worker_image }}
          SCOPE_RAILWAY_REGISTRY_USERNAME: ${{ secrets.RAILWAY_REGISTRY_USERNAME }}
          SCOPE_RAILWAY_REGISTRY_PASSWORD: ${{ secrets.RAILWAY_REGISTRY_PASSWORD }}
        run: |
          [[ "$PREPARE_BACKEND" == 1 ]] || unset SCOPE_MAINTENANCE_BINARY
          bash .github/scripts/prepare-release-images.sh

      - name: Upload immutable release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prepared-release-${{ inputs.source_sha }}
          path: prepared-release.json
          if-no-files-found: error
          retention-days: 90
