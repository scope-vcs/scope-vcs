name: Publish CLI

on:
  workflow_call:
    outputs:
      tag:
        description: GitHub Release tag that holds this revision's CLI artifacts
        value: ${{ jobs.publish.outputs.tag }}

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish CLI release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.published.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26

      - name: Reuse the release this revision already published
        id: published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(node deploy/scripts/cli-release-manifest.mjs "$GITHUB_SHA")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          bash deploy/scripts/reuse-cli-release.sh "$tag" cli/dist/cli-release.json >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        if: steps.published.outputs.exists != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
          pattern: scope-*
          path: cli/dist
          merge-multiple: true

      - name: Write the release manifest
        if: steps.published.outputs.exists != 'true'
        shell: bash
        run: node deploy/scripts/cli-release-manifest.mjs "$GITHUB_SHA" cli/dist cli/dist/cli-release.json

      - name: Attest build provenance
        if: steps.published.outputs.exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            cli/dist/scope-*
            cli/dist/cli-release.json

      - name: Publish the GitHub Release
        if: steps.published.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.published.outputs.tag }}
        run: |
          mapfile -t artifacts < <(jq -r '.targets[].artifact | "cli/dist/" + .' cli/distribution/targets.json)
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Scope CLI ${TAG#cli-}" \
            --notes "Scope CLI built from $GITHUB_SHA. Install with the commands at https://scopevcs.com." \
            --latest=false \
            "${artifacts[@]}" cli/dist/cli-release.json

      - uses: ./.github/actions/install-railway-cli

      - name: Pin the web installers to this release
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          manifest=.github/deployment-services.json
          railway variable set --project "$(jq -er '.railway.projectId' "$manifest")" \
            --environment "$(jq -er '.environments.production.environmentId' "$manifest")" \
            --service "$(jq -er '.services.web.id' "$manifest")" --skip-deploys \
            "SCOPE_CLI_RELEASE=$(jq -c '{tag, artifacts}' cli/dist/cli-release.json)" >/dev/null

