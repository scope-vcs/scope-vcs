name: Publish CLI

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        default: ""
      artifact_run_id:
        type: string
        default: ""
      verified_successful_sha:
        type: string
        default: ""

permissions:
  actions: read
  contents: read
  deployments: write
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy CLI downloads
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
          pattern: scope-*
          path: cli/dist
          merge-multiple: true

      - name: Download service
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
          name: cli-service-release-${{ inputs.source_sha || github.sha }}
          path: artifacts

      - name: Verify artifacts and write checksums
        shell: bash
        run: |
          mapfile -t expected < <(jq -r '.targets[].artifact' cli/distribution/targets.json)

          for artifact in "${expected[@]}"; do
            test -s "cli/dist/$artifact"
          done

          (
            cd cli/dist
            for artifact in "${expected[@]}"; do
              sha256sum "$artifact" > "$artifact.sha256"
            done
          )

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Stage CLI image context
        shell: bash
        run: |
          rm -rf .railway-cli
          mkdir -p .railway-cli/bin .railway-cli/dist
          tar --extract --gzip \
            --file artifacts/scope-cli-service.tar.gz \
            --directory .railway-cli/bin
          cp -a cli/dist/. .railway-cli/dist/
          chmod 0755 .railway-cli/bin/scope-cli-service

      - name: Set up image builder
        uses: docker/setup-buildx-action@v3

      - name: Authenticate image publishing
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare immutable CLI image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCOPE_DEPLOYMENT_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          SCOPE_RAILWAY_REGISTRY_USERNAME: ${{ secrets.RAILWAY_REGISTRY_USERNAME }}
          SCOPE_RAILWAY_REGISTRY_PASSWORD: ${{ secrets.RAILWAY_REGISTRY_PASSWORD }}
        run: bash .github/scripts/prepare-railway-artifact.sh cli-downloads .railway-cli prepared-cli-release.json

      - name: Install Railway CLI
        run: |
          railway_cli_version="$(jq -r '.railway.cliVersion' .github/deployment-services.json)"
          npm install -g "@railway/cli@$railway_cli_version"

      - name: Deploy artifacts to Railway
        shell: bash
        env:
          RAILWAY_DEPLOY_MESSAGE: ${{ github.event.head_commit.message || github.workflow }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SCOPE_PREPARED_RELEASE_PATH: prepared-cli-release.json
          SCOPE_RAILWAY_REGISTRY_USERNAME: ${{ secrets.RAILWAY_REGISTRY_USERNAME }}
          SCOPE_RAILWAY_REGISTRY_PASSWORD: ${{ secrets.RAILWAY_REGISTRY_PASSWORD }}
          SCOPE_DEPLOYMENT_COMPONENT: cli-downloads
          SCOPE_DEPLOYMENT_EVIDENCE_PATH: production-deployments.ndjson
          SCOPE_DEPLOYMENT_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          SCOPE_VERIFIED_SUCCESSFUL_SHA: ${{ inputs.verified_successful_sha }}
        run: |
          manifest=.github/deployment-services.json
          RAILWAY_PROJECT_ID="$(jq -r '.railway.projectId' "$manifest")"
          SCOPE_RAILWAY_ENVIRONMENT_ID="$(jq -r '.environments.production.environmentId' "$manifest")"
          export RAILWAY_PROJECT_ID SCOPE_RAILWAY_ENVIRONMENT_ID
          service_id="$(jq -r '.services["cli-downloads"].id' "$manifest")"
          public_origin="$(jq -er '.environments.production.cliPublicOrigin' "$manifest")"
          railway variable set --project "$RAILWAY_PROJECT_ID" \
            --environment "$SCOPE_RAILWAY_ENVIRONMENT_ID" --service "$service_id" \
            --skip-deploys "SCOPE_CLI_PUBLIC_URL=$public_origin"
          bash .github/scripts/deploy-railway.sh "$service_id"

      - name: Record successful Railway deployment
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/production-deployment-progress.mjs record-file \
            --file production-deployments.ndjson \
            --log-url "$LOG_URL"
