name: Daily monitors

on:
  schedule:
    - cron: '7 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-monitors
  cancel-in-progress: false

jobs:
  production-backup:
    name: Check the latest production backup
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check schedules and latest completed production backup
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: node deploy/scripts/check-production-backups.mjs

  ci-duration:
    name: Check pull request CI duration
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Report jobs over the time budget
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          retries: 3
          script: |
            const { reportCiDuration } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ci-duration.mjs`);
            await reportCiDuration({
              github, ...context.repo,
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
