name: Deployment watcher heartbeat

on:
  schedule:
    - cron: '11-56/15 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: deployment-watcher-heartbeat
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check expected daily starts and active supervision health
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE_DEPLOYMENT_WATCHER_HEARTBEAT: ${{ vars.SCOPE_DEPLOYMENT_WATCHER_HEARTBEAT }}
          SCOPE_DEPLOYMENT_SESSION_STATUS: ${{ vars.SCOPE_DEPLOYMENT_SESSION_STATUS }}
        run: python3 deploy/automation/heartbeat.py check
