name: Audit Railway experiments

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: audit-railway-experiments
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Checkout main audit policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github
      - name: Read Railway environment identities
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          source .github/scripts/railway-graphql.sh
          project_id="$(jq -er '.railway.projectId' .github/deployment-services.json)"
          # shellcheck disable=SC2016
          query='query($id:String!){project(id:$id){id environments(first:100){pageInfo{hasNextPage} edges{node{id name createdAt isEphemeral sourceEnvironment{id}}}}}}'
          railway_graphql read "$query" "$(jq -cn --arg id "$project_id" '{id:$id}')" > "$RUNNER_TEMP/railway-environments.json"
      - name: Read open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --paginate --slurp "repos/$GH_REPO/pulls?state=open&per_page=100" | jq 'add | map({number, state})' > "$RUNNER_TEMP/open-pull-requests.json"
      - name: Audit experiment owners and expiry
        run: node .github/scripts/audit-railway-experiments.mjs "$RUNNER_TEMP/railway-environments.json" "$RUNNER_TEMP/open-pull-requests.json"
