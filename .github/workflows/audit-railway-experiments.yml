name: Audit Railway experiments

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: audit-railway-experiments
  cancel-in-progress: false

jobs:
  reconcile:
    name: Plan stale preview cleanup
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    outputs:
      pull_requests: ${{ steps.plan.outputs.pull_requests }}
    steps:
      - name: Checkout main cleanup policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github
      - name: Read Railway environment identities
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: bash .github/scripts/read-railway-environments.sh > "$RUNNER_TEMP/railway-environments.json"
      - name: Plan cleanup from current pull requests
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/preview-pull-request.mjs reconcile "$RUNNER_TEMP/railway-environments.json"

  cleanup:
    name: Reconcile preview environment
    needs: reconcile
    if: needs.reconcile.outputs.pull_requests != '[]'
    strategy:
      fail-fast: false
      matrix:
        pull_request: ${{ fromJSON(needs.reconcile.outputs.pull_requests) }}
    uses: ./.github/workflows/preview-environment-cleanup.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      pull_request: ${{ matrix.pull_request }}

  audit:
    needs: [reconcile, cleanup]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Checkout main audit policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github
      - name: Read Railway environment identities
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: bash .github/scripts/read-railway-environments.sh > "$RUNNER_TEMP/railway-environments.json"
      - name: Read open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --paginate --slurp "repos/$GH_REPO/pulls?state=open&per_page=100" | jq 'add | map({number, state, labels})' > "$RUNNER_TEMP/open-pull-requests.json"
      - name: Audit experiment owners and expiry
        run: node .github/scripts/audit-railway-experiments.mjs "$RUNNER_TEMP/railway-environments.json" "$RUNNER_TEMP/open-pull-requests.json"
