name: Warm CI caches

on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - '**/Cargo.toml'
      - rust-toolchain.toml
      - media-worker/Dockerfile
      - runner-runtime/**
      - dev/tool-versions.json
      - deploy/railway/install-git.sh
      - dev/checks/backend
      - .github/workflows/warm-ci-caches.yml
      - .github/workflows/rust-workspace-checks.yml
      - .github/workflows/scope-api-ci.yml
      - .github/workflows/scope-media-worker-image.yml
      - .github/workflows/scope-runner-image.yml

concurrency:
  group: warm-ci-caches
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend caches
    uses: ./.github/workflows/scope-api-ci.yml

  media-worker-image:
    name: Media worker image cache
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/scope-media-worker-image.yml
    with:
      source_sha: ${{ github.sha }}

  runner-image:
    name: Runner image cache
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Git build version
        id: git
        run: |
          echo "version=$(jq -er '.git.version' dev/tool-versions.json)" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$(jq -er '.git.sourceSha256' dev/tool-versions.json)" >> "$GITHUB_OUTPUT"

      - name: Set up image builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Cache runner image layers
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: runner-runtime/Dockerfile
          platforms: linux/amd64
          cache-from: type=registry,ref=ghcr.io/scope-vcs/scope-runner-base:buildcache
          cache-to: type=registry,ref=ghcr.io/scope-vcs/scope-runner-base:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          outputs: type=cacheonly
          provenance: false
          build-args: |
            GIT_VERSION=${{ steps.git.outputs.version }}
            GIT_SOURCE_SHA256=${{ steps.git.outputs.source_sha256 }}
