name: Validate server components

on:
  workflow_call:
    inputs:
      backend:
        type: string
        default: "false"
      web:
        type: string
        default: "false"
      release_sha:
        type: string
        required: true
      release:
        type: boolean
        default: false
      reuse_artifacts:
        type: boolean
        default: false
    outputs:
      media_worker_image:
        value: ${{ jobs.media-worker-image.outputs.image_ref }}

permissions:
  contents: read

jobs:
  backend-validation:
    name: Backend validation
    if: ${{ !inputs.reuse_artifacts && inputs.backend == 'true' }}
    uses: ./.github/workflows/scope-api-ci.yml
    with:
      build_release_artifact: ${{ inputs.release }}
      build_router_release: ${{ inputs.release }}
    secrets: inherit

  media-worker-image:
    name: Media worker image
    if: ${{ !inputs.reuse_artifacts && inputs.backend == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/scope-media-worker-image.yml
    with:
      publish: ${{ inputs.release }}
      source_sha: ${{ inputs.release_sha }}
    secrets: inherit

  web-validation:
    name: Web validation
    if: ${{ !inputs.reuse_artifacts && inputs.web == 'true' }}
    uses: ./.github/workflows/scope-web-ci.yml
    with:
      build_release_artifact: ${{ inputs.release }}
    secrets: inherit

  server-validation-gate:
    name: Server validation gate
    needs: [backend-validation, media-worker-image, web-validation]
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Reject cancelled validation
        if: ${{ cancelled() }}
        run: exit 1
      - name: Require server validations
        env:
          VALIDATIONS_PASSED: >-
            ${{ inputs.reuse_artifacts || (
            (inputs.backend != 'true' || (needs.backend-validation.result == 'success' && needs.media-worker-image.result == 'success')) &&
            (inputs.web != 'true' || needs.web-validation.result == 'success')) }}
        run: test "$VALIDATIONS_PASSED" = true
