name: Scope Backend CI

on:
  workflow_call:
    inputs:
      build_release_artifact:
        type: boolean
        default: false
      build_router_release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dependency-analyzer:
    name: Check dependency analyzer
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dependency-analyzer/package-lock.json

      - name: Check dependency analyzer
        run: ./dev/checks/dependency-analyzer

  checks:
    uses: ./.github/workflows/rust-workspace-checks.yml

  release-artifact:
    name: Build backend deployment binaries
    if: inputs.build_release_artifact
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node for deployment metadata
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: backend-deploy
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      - name: Build deployment binaries
        env:
          BUILD_ROUTER: ${{ inputs.build_router_release && '1' || '0' }}
        run: |
          mkdir -p artifacts/bin
          binary_sizes=()
          record_size() { binary_sizes+=("$1 $(wc -c < "artifacts/bin/$1")"); }
          cargo build --release --locked -p api --bin scope-maintenance
          install -m 0755 target/release/scope-maintenance artifacts/bin/scope-maintenance
          record_size scope-maintenance

          component_names="$(node .github/scripts/deployment-components.mjs backend-prebuilt)"
          mapfile -t components <<< "$component_names"
          for component in "${components[@]}"; do
            [[ "$component" != git-router || "$BUILD_ROUTER" == 1 ]] || continue
            definition="$(node .github/scripts/deployment-components.mjs describe "$component")"
            runtime_config="$(jq -er '.runtimeConfig' <<< "$definition")"
            source_binary="$(jq -er '.artifact.sourceBinary' <<< "$definition")"
            release_binary="$(jq -er '.artifact.binary' <<< "$definition")"
            cargo build --release --locked --manifest-path "$(dirname "$runtime_config")/Cargo.toml" --bin "$source_binary"
            install -m 0755 "target/release/$source_binary" "artifacts/bin/$release_binary"
            record_size "$release_binary"
          done

          {
            echo "### Backend release binary sizes"
            echo
            echo "| Binary | Bytes | MiB |"
            echo "| --- | ---: | ---: |"
            for entry in "${binary_sizes[@]}"; do
              read -r name bytes <<< "$entry"
              awk -v name="$name" -v bytes="$bytes" 'BEGIN { printf "| `%s` | %s | %.1f |\n", name, bytes, bytes / 1048576 }'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pack deployment binaries
        run: |
          cp LICENSE NOTICE legal/third-party-rust.txt artifacts/bin/
          mkdir -p artifacts/bin/dependency-analyzer
          cp dependency-analyzer/package.json \
            dependency-analyzer/package-lock.json \
            dependency-analyzer/analyze.mjs \
            artifacts/bin/dependency-analyzer/
          cp -a dependency-analyzer/src artifacts/bin/dependency-analyzer/src
          cp legal/third-party-dependency-analyzer.txt artifacts/bin/dependency-analyzer/
          tar --create --gzip \
            --file artifacts/backend-release.tar.gz \
            --directory artifacts/bin \
            .

      - name: Upload deployment binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-release-${{ github.sha }}
          path: artifacts/backend-release.tar.gz
          if-no-files-found: error
