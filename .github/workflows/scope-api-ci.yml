name: Scope Backend CI

on:
  workflow_call:
    inputs:
      build_release_artifact:
        type: boolean
        default: false
      run_checks:
        type: boolean
        default: true
      warm_cache:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    if: inputs.run_checks
    uses: ./.github/workflows/rust-workspace-checks.yml

  deployment-binaries:
    name: Build ${{ matrix.group }} deployment binaries
    if: ${{ !inputs.warm_cache }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: api
            components: api
          - group: services
            components: run-worker git-router media-api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node for deployment metadata
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.1

      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: backend-deploy
          save-if: false

      - name: Build deployment binaries
        env:
          COMPONENTS: ${{ matrix.components }}
        run: |
          for component in $COMPONENTS; do
            node deploy/scripts/deployment-components.mjs build "$component" "artifacts/$component"
            node deploy/scripts/check-backend-binary-sizes.mjs "artifacts/$component" --component "$component"
            mkdir -p artifacts/bin
            mv "artifacts/$component"/* artifacts/bin/
          done

      - name: Upload deployment binaries
        if: inputs.build_release_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-binaries-${{ matrix.group }}-${{ github.sha }}
          path: artifacts/bin
          if-no-files-found: error
          retention-days: 1

  deployment-release:
    name: Pack backend deployment binaries
    needs: deployment-binaries
    if: inputs.build_release_artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node for deployment metadata
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26

      - name: Download deployment binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: backend-binaries-*-${{ github.sha }}
          path: artifacts/bin
          merge-multiple: true

      - name: Check deployment binary sizes
        run: |
          chmod 0755 artifacts/bin/*
          node deploy/scripts/check-backend-binary-sizes.mjs artifacts/bin

      - name: Pack deployment binaries
        run: |
          cp LICENSE NOTICE legal/third-party-rust.txt artifacts/bin/
          tar --create --gzip \
            --file artifacts/backend-release.tar.gz \
            --directory artifacts/bin \
            .

      - name: Upload deployment binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-release-${{ github.sha }}
          path: artifacts/backend-release.tar.gz
          if-no-files-found: error

  deployment-cache:
    name: Warm backend deployment cache
    if: inputs.warm_cache
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node for deployment metadata
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: backend-deploy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build every deployment binary
        run: |
          mapfile -t components < <(node deploy/scripts/deployment-components.mjs backend-prebuilt)
          for component in "${components[@]}"; do
            node deploy/scripts/deployment-components.mjs build "$component" artifacts/bin
          done
