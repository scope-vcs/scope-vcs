name: Scope Web CI

on:
  workflow_call:
    inputs:
      build_release_artifact:
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    name: Check scope-web
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.1.0

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check scope-web
        run: ../dev/checks/web

      - name: Pack validated web runtime
        if: inputs.build_release_artifact
        run: tar --create --gzip --file web-release.tar.gz .output

      - name: Upload web runtime
        if: inputs.build_release_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-release-${{ github.sha }}
          path: web/web-release.tar.gz
          if-no-files-found: error
