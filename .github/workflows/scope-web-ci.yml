name: Scope Web CI

on:
  workflow_call:
    inputs:
      build_release_artifact:
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checks:
    name: Check scope-web
    runs-on: blacksmith-4vcpu-ubuntu-2404
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.1.0

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check scope-web
        run: ../dev/checks/web

      - name: Pack validated web runtime
        if: inputs.build_release_artifact
        run: tar --create --gzip --file web-release.tar.gz .output

      - name: Upload web runtime
        if: inputs.build_release_artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-release-${{ github.sha }}
          path: web/web-release.tar.gz
          if-no-files-found: error
