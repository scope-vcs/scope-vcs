name: Scope CLI Build

on:
  workflow_call:
    inputs:
      validate_targets:
        type: boolean
        default: false
      validate_service_release:
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Prepare distribution matrix
    if: inputs.validate_targets
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read distribution targets
        id: targets
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mode=release
          [[ "$EVENT_NAME" == "pull_request" ]] && mode=pull-request
          matrix="$(node .github/scripts/select-cli-distribution-targets.mjs --mode "$mode")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  checks:
    name: Check scope-cli
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      # The distribution matrix builds, packages, and uploads the service
      # artifact, so a service release cannot skip the matrix.
      - name: Require the distribution matrix for a service release
        if: inputs.validate_service_release && !inputs.validate_targets
        run: |
          echo 'A service release needs validate_targets; the matrix uploads it.' >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install reviewed Git on Linux
        run: |
          version="$(jq -er '.git.version' dev/tool-versions.json)"
          source_sha256="$(jq -er '.git.sourceSha256' dev/tool-versions.json)"
          sudo bash deploy/railway/install-git.sh "$version" "$source_sha256"
          echo /opt/git/bin >> "$GITHUB_PATH"

      - name: Verify host Git version
        run: node dev/check-git-version.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: cli-checks
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          workspaces: cli -> target

      - name: Check CLI
        run: ./dev/checks/cli

      # The distribution matrix release-builds, packages, and smoke-tests every
      # selected target, including native Linux x64. Only cover the host here
      # when the matrix does not run.
      - name: Check host bundle and installer
        if: ${{ !inputs.validate_targets }}
        run: ./dev/checks/cli-bundle

  build:
    name: ${{ matrix.label }} / ${{ matrix.smoke && 'native checks' || 'build only' }}
    env:
      SCOPE_BUILD_SHA: ${{ github.sha }}
      CROSS_CONFIG: ${{ github.workspace }}/Cross.toml
    needs: [checks, prepare]
    if: inputs.validate_targets
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install reviewed Git on Linux
        if: runner.os == 'Linux'
        run: |
          version="$(jq -er '.git.version' dev/tool-versions.json)"
          source_sha256="$(jq -er '.git.sourceSha256' dev/tool-versions.json)"
          sudo bash deploy/railway/install-git.sh "$version" "$source_sha256"
          echo /opt/git/bin >> "$GITHUB_PATH"

      - name: Install current Git on macOS
        if: runner.os == 'macOS'
        run: |
          brew update
          if brew list --versions git >/dev/null; then
            brew upgrade git
          else
            brew install git
          fi
          echo "$(brew --prefix git)/bin" >> "$GITHUB_PATH"

      - name: Install Git for Windows 2.55
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content dev/tool-versions.json | ConvertFrom-Json).git.windowsPackageVersion
          choco upgrade git --version=$version --yes --no-progress
          'C:\Program Files\Git\cmd' | Out-File -FilePath $env:GITHUB_PATH -Append
          & 'C:\Program Files\Git\cmd\git.exe' --version

      - name: Verify host Git version
        shell: bash
        run: node dev/check-git-version.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: ${{ matrix.builder == 'cross' }}
          shared-key: cli-build-${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          workspaces: cli -> target

      - name: Install cross
        if: matrix.builder == 'cross'
        working-directory: cli
        env:
          CARGO_TARGET_DIR: target/cargo-install
        run: cargo install cross --version 0.2.5 --locked

      - name: Build scope
        shell: bash
        run: |
          # Cross mounts the current directory; include the root license files.
          if [ "${{ matrix.builder }}" = "cross" ]; then
            cross build --manifest-path cli/Cargo.toml --release --locked --target "${{ matrix.target }}" --bin scope
          else
            cargo build --manifest-path cli/Cargo.toml --release --locked --target "${{ matrix.target }}" --bin scope
          fi

      - name: Test portable command contracts
        if: matrix.smoke
        shell: bash
        run: >
          cargo test --manifest-path cli/Cargo.toml --release --locked
          --target "${{ matrix.target }}" --test version --test licenses

      - name: Test authentication boundaries without accessing native credential stores
        if: matrix.smoke
        shell: bash
        run: |
          cargo test --manifest-path cli/Cargo.toml --release --locked --target "${{ matrix.target }}" --lib auth::tests
          cargo test --manifest-path cli/Cargo.toml --release --locked --target "${{ matrix.target }}" --lib git_credential::tests
          cargo test --manifest-path cli/Cargo.toml --release --locked --target "${{ matrix.target }}" --lib login::tests

      - name: Test native progress and cancellation
        if: matrix.smoke
        shell: bash
        run: >
          cargo test --manifest-path cli/Cargo.toml --release --locked
          --target "${{ matrix.target }}" --lib progress::

      - name: Test Windows journal replacement and installer quoting
        if: matrix.smoke && runner.os == 'Windows'
        shell: bash
        run: |
          cargo test --manifest-path cli/Cargo.toml --release --locked --target "${{ matrix.target }}" --lib request::attachments::journal::tests::windows_replacement_sharing_failure_keeps_both_files -- --exact
          cargo test --manifest-path cli/Cargo.toml --release --locked --target "${{ matrix.target }}" --lib installers::tests::powershell_origin_assignment_is_literal_data -- --exact

      - name: Build native installer service
        if: matrix.smoke
        shell: bash
        run: >
          cargo build --manifest-path cli/Cargo.toml --release --locked
          --target "${{ matrix.target }}" --bin scope-cli-service

      - name: Install Node for analyzer packaging
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Install trusted analyzer dependencies
        working-directory: dependency-analyzer
        run: npm ci --ignore-scripts

      - name: Verify release identity
        working-directory: cli
        shell: bash
        run: |
          # Check the final binary after every Cargo invocation that can rebuild it.
          : "${SCOPE_BUILD_SHA:?Release build SHA is required}"
          grep -aFq "$SCOPE_BUILD_SHA" "${{ matrix.binary }}" || {
            echo "Release binary is missing build $SCOPE_BUILD_SHA" >&2
            exit 1
          }
          if [ "${{ matrix.smoke }}" = "true" ]; then
            identity="$("./${{ matrix.binary }}" --version)"
            expected="^scope [^ ]+ \(build $SCOPE_BUILD_SHA; protocol [0-9]+\)$"
            [[ "$identity" =~ $expected ]] || {
              echo "Unexpected release identity: $identity" >&2
              exit 1
            }
          fi

      - name: Package CLI and managed analyzer runtime
        shell: bash
        env:
          SCOPE_BINARY: cli/${{ matrix.binary }}
          SCOPE_ARTIFACT: cli/dist/${{ matrix.artifact }}
          SCOPE_NODE_VERSION: ${{ matrix.node_version }}
          SCOPE_NODE_PLATFORM: ${{ matrix.node_platform }}
          SCOPE_NODE_SHA256: ${{ matrix.node_sha256 }}
        run: bash cli/distribution/package-bundle.sh

      - name: Verify Rust integration with packaged analyzer
        if: matrix.smoke
        shell: bash
        env:
          SCOPE_ARTIFACT: cli/dist/${{ matrix.artifact }}
        run: >
          bash cli/distribution/verify-bundled-analyzer.sh
          --release --target "${{ matrix.target }}"

      - name: Verify native install, update, checksum, and PATH
        if: matrix.smoke
        env:
          SCOPE_TEST_BINARY: cli/${{ matrix.binary }}
          SCOPE_TEST_ARTIFACT: cli/dist/${{ matrix.artifact }}
        run: node --test cli/distribution/install-smoke.test.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: cli/dist/${{ matrix.artifact }}
          if-no-files-found: error

      # The CLI download service runs on Linux x64; publish-cli.yml extracts this
      # archive straight into the image's bin directory.
      - name: Pack service
        if: inputs.validate_service_release && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          mkdir -p artifacts
          release=cli/target/${{ matrix.target }}/release
          cp LICENSE NOTICE legal/third-party-rust.txt "$release/"
          tar --create --gzip \
            --file artifacts/scope-cli-service.tar.gz \
            --directory "$release" \
            scope-cli-service LICENSE NOTICE third-party-rust.txt

      - name: Upload service
        if: inputs.validate_service_release && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-service-release-${{ github.sha }}
          path: artifacts/scope-cli-service.tar.gz
          if-no-files-found: error
