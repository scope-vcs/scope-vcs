name: Scope CLI Build

on:
  workflow_call:
    inputs:
      validate_targets:
        type: boolean
        default: false
      validate_service_release:
        type: boolean
        default: false
      distribution_mode:
        type: string
        default: pull-request

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Prepare distribution matrix
    if: inputs.validate_targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read distribution targets
        id: targets
        shell: bash
        env:
          MODE: ${{ inputs.distribution_mode }}
        run: |
          matrix="$(node .github/scripts/select-cli-distribution-targets.mjs --mode "$MODE")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  checks:
    name: Check scope-cli
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require the distribution matrix for a service release
        if: inputs.validate_service_release && !inputs.validate_targets
        run: |
          echo 'A service release needs validate_targets; the matrix uploads it.' >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install reviewed Git on Linux
        uses: ./.github/actions/install-reviewed-git

      - name: Verify host Git version
        run: node dev/check-git-version.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: cli-checks
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          workspaces: |
            cli -> target
            . -> target

      - name: Install cargo tools
        run: ./dev/install-cargo-tools.sh

      - name: Check CLI
        run: ./dev/checks/cli

  bundle:
    name: Check scope-cli host bundle
    if: ${{ !inputs.validate_targets }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install reviewed Git on Linux
        uses: ./.github/actions/install-reviewed-git

      - name: Verify host Git version
        run: node dev/check-git-version.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.100.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: cli-checks
          save-if: false
          workspaces: |
            cli -> target
            . -> target

      - name: Check host bundle and installer
        run: ./dev/checks/cli-bundle

  build:
    name: ${{ matrix.label }} / ${{ matrix.smoke && 'native checks' || 'build only' }}
    env:
      SCOPE_BUILD_SHA: ${{ github.sha }}
      CROSS_CONFIG: ${{ github.workspace }}/Cross.toml
    needs: prepare
    if: inputs.validate_targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install reviewed Git on Linux
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-reviewed-git

      - name: Install Git 2.55 or newer on macOS
        if: runner.os == 'macOS'
        run: |
          git_bin="$(brew --prefix git)/bin"
          if ! PATH="$git_bin:$PATH" node dev/check-git-version.mjs; then
            brew update
            if brew list --versions git >/dev/null; then
              brew upgrade git
            else
              brew install git
            fi
          fi
          echo "$git_bin" >> "$GITHUB_PATH"

      - name: Install Git for Windows 2.55
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content dev/tool-versions.json | ConvertFrom-Json).git.windowsPackageVersion
          choco upgrade git --version=$version --yes --no-progress
          'C:\Program Files\Git\cmd' | Out-File -FilePath $env:GITHUB_PATH -Append
          & 'C:\Program Files\Git\cmd\git.exe' --version

      - name: Verify host Git version
        shell: bash
        run: node dev/check-git-version.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: ${{ matrix.builder == 'cross' }}
          shared-key: cli-build-${{ matrix.profile }}-${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && matrix.profile != 'release' }}
          workspaces: |
            cli -> target
            . -> target

      - name: Install cross
        if: matrix.builder == 'cross'
        working-directory: cli
        env:
          CARGO_TARGET_DIR: target/cargo-install
        run: cargo install cross --version 0.2.5 --locked

      - name: Build scope and the native installer service
        shell: bash
        run: |
          service=
          if [ "${{ matrix.smoke }}" = "true" ]; then
            cargo build -p scope-cli-downloads --release --locked --target "${{ matrix.target }}" &
            service=$!
          fi
          if [ "${{ matrix.builder }}" = "cross" ]; then
            cross build --manifest-path cli/Cargo.toml --profile "${{ matrix.profile }}" --locked --target "${{ matrix.target }}" --bin scope
          else
            cargo build --manifest-path cli/Cargo.toml --profile "${{ matrix.profile }}" --locked --target "${{ matrix.target }}" --bin scope
          fi
          if [ -n "$service" ]; then
            wait "$service"
          fi

      - name: Build native test binaries
        if: matrix.smoke
        shell: bash
        run: >
          cargo test --manifest-path cli/Cargo.toml --profile "${{ matrix.profile }}" --locked
          --target "${{ matrix.target }}" --no-run --test version --test licenses --lib

      - name: Test portable command contracts
        if: matrix.smoke
        shell: bash
        run: >
          cargo test --manifest-path cli/Cargo.toml --profile "${{ matrix.profile }}" --locked
          --target "${{ matrix.target }}" --test version --test licenses

      - name: Test authentication boundaries, progress, and cancellation without native credential stores
        if: matrix.smoke
        shell: bash
        run: >
          cargo test --manifest-path cli/Cargo.toml --profile "${{ matrix.profile }}" --locked
          --target "${{ matrix.target }}" --lib -- auth::tests git_credential::tests login::tests progress::

      - name: Test Windows installer quoting
        if: matrix.smoke && runner.os == 'Windows'
        shell: bash
        run: |
          cargo test -p scope-cli-downloads --release --locked --target "${{ matrix.target }}" --bin scope-cli-service installers::tests::powershell_origin_assignment_is_literal_data -- --exact

      - name: Verify release identity
        working-directory: cli
        shell: bash
        run: |
          : "${SCOPE_BUILD_SHA:?Release build SHA is required}"
          grep -aFq "$SCOPE_BUILD_SHA" "${{ matrix.binary }}" || {
            echo "Release binary is missing build $SCOPE_BUILD_SHA" >&2
            exit 1
          }
          if [ "${{ matrix.smoke }}" = "true" ]; then
            identity="$("./${{ matrix.binary }}" --version)"
            expected="^scope [^ ]+ \(build $SCOPE_BUILD_SHA; protocol [0-9]+\)$"
            [[ "$identity" =~ $expected ]] || {
              echo "Unexpected release identity: $identity" >&2
              exit 1
            }
          fi

      - name: Package CLI
        shell: bash
        env:
          SCOPE_BINARY: cli/${{ matrix.binary }}
          SCOPE_ARTIFACT: cli/dist/${{ matrix.artifact }}
        run: bash cli/distribution/package-bundle.sh

      - name: Install Node for the installer smoke test
        if: matrix.smoke
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26

      - name: Verify native install, update, checksum, and PATH
        if: matrix.smoke
        env:
          SCOPE_TEST_BINARY: cli/${{ matrix.binary }}
          SCOPE_TEST_ARTIFACT: cli/dist/${{ matrix.artifact }}
          SCOPE_TEST_SERVICE: target/${{ matrix.target }}/release/scope-cli-service${{ runner.os == 'Windows' && '.exe' || '' }}
        run: node --test cli/distribution/install-smoke.test.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: cli/dist/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Pack service
        if: inputs.validate_service_release && matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          mkdir -p artifacts
          release=target/${{ matrix.target }}/release
          cp LICENSE NOTICE legal/third-party-rust.txt "$release/"
          tar --create --gzip \
            --file artifacts/scope-cli-service.tar.gz \
            --directory "$release" \
            scope-cli-service LICENSE NOTICE third-party-rust.txt

      - name: Upload service
        if: inputs.validate_service_release && matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-service-release-${{ github.sha }}
          path: artifacts/scope-cli-service.tar.gz
          if-no-files-found: error
