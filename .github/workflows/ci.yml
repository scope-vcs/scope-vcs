name: CI

on:
  pull_request:
  push:
    branches: ['scope/**']

concurrency:
  group: scope-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pull-request:
    name: Find pull request at this commit
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.find.outputs.number }}
    steps:
      - name: Find a pull request run that tests this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          number=""
          for attempt in {1..8}; do
            (( attempt == 1 )) || sleep 30
            candidate="$(gh api "repos/$REPOSITORY/commits/$SHA/pulls" --jq "[.[] | select(
              .state == \"open\" and .head.sha == \"$SHA\" and .base.ref == \"main\" and
              .head.repo.full_name == \"$REPOSITORY\" and .user.login != \"dependabot[bot]\")][0].number // empty")"
            [[ -n "$candidate" ]] || continue
            run="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$SHA" \
              --jq "[.workflow_runs[] | select(any(.pull_requests[]; .number == $candidate))][0].id // empty")"
            if [[ -n "$run" ]]; then
              number="$candidate"
              break
            fi
          done
          echo "number=$number" >> "$GITHUB_OUTPUT"

  plan:
    name: Plan selected components
    needs: pull-request
    if: ${{ !cancelled() && needs.pull-request.outputs.number == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      runner_image: ${{ steps.plan.outputs.runner_image }}
      backend_selected: ${{ steps.plan.outputs.backend_selected }}
      web: ${{ steps.plan.outputs.web }}
      cli: ${{ steps.plan.outputs.cli }}
      cli_distribution: ${{ steps.plan.outputs.cli_distribution }}
    steps:
      - name: Checkout revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find comparison base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PULL_REQUEST_BASE_SHA"
          else
            base="$(git merge-base origin/main HEAD)"
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Select affected components
        id: plan
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUESTED_SCOPE: changed
        run: >-
          node .github/scripts/plan-production-deployment.mjs
          --manifest .github/deployment-services.json
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --scope "$REQUESTED_SCOPE"

  policy:
    name: Check repository policy
    needs: pull-request
    if: ${{ !cancelled() && needs.pull-request.outputs.number == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Check repository policy
        run: ./dev/checks/policy

  ops:
    name: Check operations
    needs: pull-request
    if: ${{ !cancelled() && needs.pull-request.outputs.number == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Install PostgreSQL test server
        run: sudo ./dev/install-test-postgres.sh
      - name: Check operations
        env:
          SCOPE_TEST_POSTGRES_BIN: /usr/lib/postgresql/18/bin
          SCOPE_REQUIRE_POSTGRES_CLUSTER: '1'
        run: ./dev/checks/ops

  validation:
    name: Validate selected components
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    permissions:
      contents: read
      deployments: write
      id-token: write
      packages: write
    uses: ./.github/workflows/validate.yml
    with:
      runner_image: ${{ needs.plan.outputs.runner_image }}
      backend: ${{ needs.plan.outputs.backend_selected }}
      web: ${{ needs.plan.outputs.web }}
      cli: ${{ needs.plan.outputs.cli }}
      cli_distribution: ${{ needs.plan.outputs.cli_distribution }}
      release_sha: ${{ github.sha }}
    secrets: inherit

  required-pr-checks:
    name: Required PR checks
    needs: [pull-request, plan, policy, ops, validation]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      actions: read
    steps:
      - name: Report the pull request's result
        if: ${{ needs.pull-request.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PULL_REQUEST: ${{ needs.pull-request.outputs.number }}
        run: |
          [[ "$PULL_REQUEST" =~ ^[0-9]+$ ]]
          echo "Pull request #$PULL_REQUEST tests $SHA"
          while :; do
            run="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$SHA" \
              --jq "[.workflow_runs[] | select(any(.pull_requests[]; .number == $PULL_REQUEST))][0] // empty
                | \"\\(.html_url) \\(.status) \\(.conclusion)\"")" || run=""
            read -r url status conclusion <<< "$run"
            if [[ "$status" == completed ]]; then
              echo "$url: $conclusion"
              test "$conclusion" = success
              exit
            fi
            sleep 30
          done

      - name: Require successful planning and validation
        if: ${{ needs.pull-request.outputs.number == '' }}
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          OPS_RESULT: ${{ needs.ops.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          echo "Planning: $PLAN_RESULT; validation: $VALIDATION_RESULT"
          test "$POLICY_RESULT" = success
          test "$OPS_RESULT" = success
          test "$PLAN_RESULT" = success
          test "$VALIDATION_RESULT" = success
