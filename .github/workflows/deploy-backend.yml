name: Deploy backend

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      recover_cutover_id:
        type: string
        default: ""
      deploy_cache:
        type: boolean
        default: false
      deploy_worker:
        type: boolean
        default: false
      deploy_router:
        type: boolean
        default: false
      deploy_api:
        type: boolean
        default: false
      deploy_media:
        type: boolean
        default: false
      deploy_media_worker:
        type: boolean
        default: false
      successful_deployments:
        type: string
        default: "{}"

    outputs:
      web_activated:
        value: ${{ jobs.deploy.outputs.web_activated }}
      maintenance_warning:
        value: ${{ jobs.deploy.outputs.maintenance_warning }}

permissions:
  contents: read
  deployments: write
  actions: read

jobs:
  deploy:
    name: Deploy backend
    outputs:
      web_activated: ${{ steps.receipt.outputs.web_activated }}
      maintenance_warning: ${{ steps.warning.outputs.maintenance_warning }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout trusted deployment orchestration
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download prepared release manifest
        uses: actions/download-artifact@v8
        with:
          name: prepared-release-${{ inputs.source_sha }}

      - name: Extract pinned maintenance binary from the API image
        env:
          SCOPE_RAILWAY_REGISTRY_USERNAME: ${{ secrets.RAILWAY_REGISTRY_USERNAME }}
          SCOPE_RAILWAY_REGISTRY_PASSWORD: ${{ secrets.RAILWAY_REGISTRY_PASSWORD }}
        run: bash .github/scripts/extract-railway-maintenance.sh prepared-release.json target/release/scope-maintenance

      - name: Install Railway CLI
        run: |
          railway_cli_version="$(jq -r '.railway.cliVersion' .github/deployment-services.json)"
          npm install -g "@railway/cli@$railway_cli_version"

      - name: Deploy to Railway
        id: transition
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCOPE_PREPARED_RELEASE_PATH: prepared-release.json
          SCOPE_RELEASE_CUTOVER_ID: ${{ inputs.recover_cutover_id }}
          SCOPE_RECOVER_CLOSED_CUTOVER: ${{ inputs.recover_cutover_id != '' && '1' || '0' }}
          SCOPE_RAILWAY_REGISTRY_USERNAME: ${{ secrets.RAILWAY_REGISTRY_USERNAME }}
          SCOPE_RAILWAY_REGISTRY_PASSWORD: ${{ secrets.RAILWAY_REGISTRY_PASSWORD }}
          RAILWAY_DEPLOY_MESSAGE: ${{ github.event.head_commit.message || github.workflow }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          SCOPE_DEPLOYMENT_EVIDENCE_PATH: production-deployments.ndjson
          SCOPE_DEPLOYMENT_SOURCE_SHA: ${{ inputs.source_sha }}
          SCOPE_SUCCESSFUL_DEPLOYMENTS: ${{ inputs.successful_deployments }}
          SCOPE_DEPLOY_CACHE: ${{ inputs.deploy_cache && '1' || '0' }}
          SCOPE_DEPLOY_WORKER: ${{ inputs.deploy_worker && '1' || '0' }}
          SCOPE_DEPLOY_ROUTER: ${{ inputs.deploy_router && '1' || '0' }}
          SCOPE_DEPLOY_API: ${{ inputs.deploy_api && '1' || '0' }}
          SCOPE_DEPLOY_MEDIA: ${{ inputs.deploy_media && '1' || '0' }}
          SCOPE_DEPLOY_MEDIA_WORKER: ${{ inputs.deploy_media_worker && '1' || '0' }}
        run: |
          manifest=.github/deployment-services.json
          RAILWAY_PROJECT_ID="$(jq -r '.railway.projectId' "$manifest")"
          SCOPE_RAILWAY_ENVIRONMENT_ID="$(jq -r '.environments.production.environmentId' "$manifest")"
          SCOPE_RAILWAY_WEB_SERVICE_ID="$(jq -er '.services.web.id' "$manifest")"
          SCOPE_RAILWAY_API_SERVICE_ID="$(jq -r '.services.api.id' "$manifest")"
          SCOPE_RAILWAY_WORKER_SERVICE_ID="$(jq -r '.services["run-worker"].id' "$manifest")"
          SCOPE_RAILWAY_CACHE_SERVICE_ID="$(jq -r '.services.cache.id' "$manifest")"
          SCOPE_RAILWAY_ROUTER_SERVICE_ID="$(jq -r '.services["git-router"].id' "$manifest")"
          SCOPE_RAILWAY_MEDIA_SERVICE_ID="$(jq -er '.services["media-api"].id | strings | select(length > 0)' "$manifest")"
          SCOPE_RAILWAY_MEDIA_WORKER_SERVICE_ID="$(jq -er '.services["media-worker"].id | strings | select(length > 0)' "$manifest")"
          SCOPE_RAILWAY_DATABASE_SERVICE_ID="$(jq -r '.railway.databaseServiceId' "$manifest")"
          SCOPE_RAILWAY_ROUTER_GROUP_ID="$(jq -r '.railway.runtimeGroupId' "$manifest")"
          SCOPE_RAILWAY_API_REGION_ID="$(jq -r '.railway.regionId' "$manifest")"
          SCOPE_RAILWAY_WORKER_REGION_ID="$SCOPE_RAILWAY_API_REGION_ID"
          SCOPE_RAILWAY_MEDIA_REGION_ID="$SCOPE_RAILWAY_API_REGION_ID"
          SCOPE_MEDIA_WORKER_IMAGE="$(jq -er '.components["media-worker"].image' prepared-release.json)"
          export RAILWAY_PROJECT_ID SCOPE_RAILWAY_ENVIRONMENT_ID
          export SCOPE_RAILWAY_WEB_SERVICE_ID
          export SCOPE_RAILWAY_API_SERVICE_ID SCOPE_RAILWAY_WORKER_SERVICE_ID
          export SCOPE_RAILWAY_CACHE_SERVICE_ID SCOPE_RAILWAY_ROUTER_SERVICE_ID
          export SCOPE_RAILWAY_MEDIA_SERVICE_ID SCOPE_RAILWAY_MEDIA_WORKER_SERVICE_ID
          export SCOPE_RAILWAY_DATABASE_SERVICE_ID
          export SCOPE_RAILWAY_ROUTER_GROUP_ID
          export SCOPE_RAILWAY_API_REGION_ID SCOPE_RAILWAY_WORKER_REGION_ID
          export SCOPE_RAILWAY_MEDIA_REGION_ID SCOPE_MEDIA_WORKER_IMAGE
          if [[ "$SCOPE_DEPLOY_MEDIA_WORKER" == "1" ]]; then
            node .github/scripts/deploy-railway-image.mjs configure-registry "$SCOPE_RAILWAY_MEDIA_WORKER_SERVICE_ID"
          fi
          bash .github/scripts/deploy-monitored-railway.sh backend bash .github/scripts/deploy-backend-railway.sh \
            api \
            worker \
            cache-service \
            repo-router \
            media

      - name: Read maintenance duration warning
        id: warning
        run: |
          warning="$(jq -er '.warnings | join("; ")' release-evidence/backend/availability-summary.json)"
          echo "maintenance_warning=$warning" >> "$GITHUB_OUTPUT"

      - name: Record successful Railway deployments
        id: receipt
        if: steps.transition.outcome == 'success'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/production-deployment-progress.mjs record-file \
            --file production-deployments.ndjson \
            --log-url "$LOG_URL"
          web_activated="$(jq -s 'any(.[]; .component == "web")' production-deployments.ndjson)"
          echo "web_activated=$web_activated" >> "$GITHUB_OUTPUT"

      - name: Upload release transition evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-backend-transition-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: release-evidence/
          if-no-files-found: warn
          retention-days: 90
