name: Staging managed runner infrastructure experiment

on:
  push:
    branches: [experiment/runner-economics]
    paths:
      - .github/workflows/staging-managed-runner-experiment.yml
      - dev/runner-economics/cleanup-aws.sh

concurrency:
  group: scope-runner-economics-staging-8743c2e9
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    name: Remove isolated staging runner infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure temporary AWS role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::957143340948:role/scope-staging-experiment-github-94d56973
          role-session-name: scope-staging-managed-runner-cleanup-${{ github.run_id }}
      - name: Save final measurements and remove experiment resources
        run: bash dev/runner-economics/cleanup-aws.sh /tmp/staging-runner-cleanup
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: staging-runner-cleanup
          path: /tmp/staging-runner-cleanup
          retention-days: 14
