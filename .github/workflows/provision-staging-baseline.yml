name: Provision staging baseline

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Retained staging-baseline artifact ID from a main Release run
        type: string
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: scope-railway-staging
  cancel-in-progress: false

jobs:
  provision:
    name: Restore retained staging baseline
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SCOPE_RAILWAY_PROJECT_TOKEN_NAME: scope-staging-baseline-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout trusted orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select the baseline's release run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" --jq '
            select(.expired == false and .workflow_run.head_branch == "main"
              and (.name | test("^staging-baseline-[0-9a-f]{64}$"))) | .workflow_run.id')"
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '
            select(.path == ".github/workflows/release.yml" and .head_branch == "main"
              and (.event == "schedule" or .event == "workflow_dispatch")) | .head_sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "run_id=$run_id"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Load staging target from trusted manifest
        run: |
          {
            echo "SCOPE_RAILWAY_PROJECT_ID=$(jq -er '.railway.projectId' .github/deployment-services.json)"
            echo "SCOPE_RAILWAY_TOKEN_ENVIRONMENT_ID=$(jq -er '.environments.staging.environmentId' .github/deployment-services.json)"
            echo "SCOPE_PREPARED_RELEASE_PATH=$GITHUB_WORKSPACE/artifacts/prepared-release.json"
            echo "SCOPE_DEPLOYMENT_MANIFEST=$GITHUB_WORKSPACE/.github/deployment-services.json"
          } >> "$GITHUB_ENV"

      - uses: ./.github/actions/install-railway-cli

      - name: Create staging-scoped Railway token
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: bash .github/scripts/railway-environment-token.sh create

      - name: Download the baseline run's prepared release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prepared-release-${{ steps.source.outputs.sha }}
          path: artifacts
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Download the baseline run's maintenance binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-release-${{ steps.source.outputs.sha }}
          path: artifacts
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Extract maintenance binary
        run: |
          mkdir -p target/release
          python3 .github/scripts/extract-railway-release.py backend artifacts/backend-release.tar.gz target/release

      - name: Close staging writers
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          unset RAILWAY_TOKEN
          bash .github/scripts/stop-railway-writers.sh

      - name: Set up PostgreSQL 18 clients
        uses: ./.github/actions/install-postgres-clients

      - name: Restore retained staging baseline
        env:
          SCOPE_RAILWAY_SSH_PRIVATE_KEY: ${{ secrets.SCOPE_RAILWAY_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          SCOPE_MAINTENANCE_BINARY: ./target/release/scope-maintenance
          SCOPE_STAGING_BASELINE_DIR: ${{ runner.temp }}/staging-baseline
          SCOPE_STAGING_BASELINE_KEY: ${{ secrets.SCOPE_STAGING_BASELINE_KEY }}
        run: bash .github/scripts/staging-baseline.sh provision "$ARTIFACT_ID"

      - name: Delete staging-scoped Railway token
        if: always()
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          unset RAILWAY_TOKEN
          bash .github/scripts/railway-environment-token.sh delete
