name: Deploy staging

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      prepared_run_id:
        type: string
        required: true
      production_plan_artifact:
        type: string
        default: ''
      run_transition_tests:
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  packages: read
  deployments: read

concurrency:
  group: scope-railway-staging
  cancel-in-progress: false

jobs:
  prepare:
    name: Build smoke tools
    permissions:
      contents: read
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Validate requested revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "${#SOURCE_SHA}" = 40 && [[ "$SOURCE_SHA" != *[^0-9a-f]* ]]

      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
          shared-key: staging-smoke
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            . -> target
            cli -> target

      - name: Build smoke binaries
        env:
          SCOPE_BUILD_SHA: ${{ inputs.source_sha }}
        run: |
          mkdir -p artifacts/commands
          cargo build --release --locked -p api --bin scope-smoke-seed --features smoke-seed
          cargo build --release --locked --manifest-path cli/Cargo.toml --bin scope
          install -m 0755 target/release/scope-smoke-seed artifacts/commands/scope-smoke-seed
          install -m 0755 cli/target/release/scope artifacts/commands/scope
          tar -czf artifacts/staging-commands.tar.gz -C artifacts/commands .

      - name: Upload staging commands
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-commands-${{ inputs.source_sha }}
          path: artifacts/staging-commands.tar.gz
          if-no-files-found: error

  prove:
    name: Deploy and smoke staging
    needs: prepare
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    outputs:
      writers_fenced: ${{ steps.close.outcome == 'success' }}
    environment: staging
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SCOPE_RAILWAY_PROJECT_TOKEN_NAME: scope-staging-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Validate requested revision
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a lowercase 40-character commit SHA." >&2
            exit 2
          fi

      - name: Checkout trusted orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Load staging target from trusted manifest
        id: target
        shell: bash
        run: |
          {
            echo "SCOPE_RAILWAY_PROJECT_ID=$(jq -er '.railway.projectId' .github/deployment-services.json)"
            echo "SCOPE_RAILWAY_STAGING_ENVIRONMENT_ID=$(jq -er '.environments.staging.environmentId' .github/deployment-services.json)"
          } >> "$GITHUB_ENV"

      - name: Install Railway CLI
        run: |
          railway_cli_version="$(jq -r '.railway.cliVersion' .github/deployment-services.json)"
          npm install -g "@railway/cli@$railway_cli_version"

      - name: Create staging-scoped Railway token
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: bash .github/scripts/staging-railway-token.sh create

      - name: Configure staging registry access with trusted orchestration
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          SCOPE_RAILWAY_REGISTRY_USERNAME: ${{ secrets.RAILWAY_REGISTRY_USERNAME }}
          SCOPE_RAILWAY_REGISTRY_PASSWORD: ${{ secrets.RAILWAY_REGISTRY_PASSWORD }}
        run: |
          unset RAILWAY_TOKEN
          node .github/scripts/railway-artifact.mjs configure-staging-registry

      - name: Download prepared candidate artifacts
        uses: actions/download-artifact@v8
        with:
          name: staging-commands-${{ inputs.source_sha }}
          path: artifacts

      - name: Download exact production images
        uses: actions/download-artifact@v8
        with:
          name: prepared-release-${{ inputs.source_sha }}
          path: artifacts
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}

      - name: Export release paths
        id: release
        run: |
          has_backend="$(jq -r '.components | has("api")' artifacts/prepared-release.json)"
          echo "has_backend=$has_backend" >> "$GITHUB_OUTPUT"
          echo "SCOPE_PREPARED_RELEASE_PATH=$GITHUB_WORKSPACE/artifacts/prepared-release.json" >> "$GITHUB_ENV"
          echo "SCOPE_DEPLOYMENT_MANIFEST=$GITHUB_WORKSPACE/.github/deployment-services.json" >> "$GITHUB_ENV"
          echo "SCOPE_MEDIA_WORKER_IMAGE=$(jq -r '.components["media-worker"].image // empty' artifacts/prepared-release.json)" >> "$GITHUB_ENV"

      - name: Download maintenance binary from prepared build
        if: steps.release.outputs.has_backend == 'true'
        uses: actions/download-artifact@v8
        with:
          name: backend-release-${{ inputs.source_sha }}
          path: artifacts
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}

      - name: Download production migration baseline
        if: steps.release.outputs.has_backend == 'true'
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.production_plan_artifact || format('production-migration-plan-{0}', inputs.source_sha) }}
          path: artifacts
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}

      - name: Close staging writers for backend upgrade
        id: close
        if: steps.release.outputs.has_backend == 'true'
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          unset RAILWAY_TOKEN
          bash .github/scripts/stop-staging-writers.sh

      # Candidate code is introduced only after privileged account-token work is complete.
      - name: Checkout exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          path: candidate
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify checked out candidate revision
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Extract candidate commands
        run: |
          mkdir -p candidate/target/release candidate/cli/target/release
          if [[ -f artifacts/backend-release.tar.gz ]]; then
            python3 .github/scripts/extract-railway-release.py backend artifacts/backend-release.tar.gz candidate/target/release
          fi
          tar -xzf artifacts/staging-commands.tar.gz -C candidate/target/release
          install -m 0755 candidate/target/release/scope candidate/cli/target/release/scope

      - name: Initialize smoke credentials directory
        shell: bash
        run: |
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/scope-staging-git-smoke.XXXXXX")"
          chmod 0700 "$smoke_dir"
          echo "SCOPE_GIT_SMOKE_DIR=$smoke_dir" >> "$GITHUB_ENV"
          echo "SCOPE_SMOKE_SEED_EXCHANGE_TOKEN_PATH=$smoke_dir/exchange-token" >> "$GITHUB_ENV"

      - name: Set up PostgreSQL 18 clients
        if: steps.release.outputs.has_backend == 'true'
        run: |
          client_bin="$RUNNER_TEMP/postgres-client-bin"
          mkdir -p "$client_bin"
          docker pull --quiet postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
          for command in pg_dump pg_restore psql; do
            cat > "$client_bin/$command" <<'CLIENT'
          #!/usr/bin/env bash
          set -euo pipefail
          exec docker run --rm -i --network host --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP:$RUNNER_TEMP" -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$PWD" --entrypoint "${0##*/}" \
            postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280 "$@"
          CLIENT
            chmod 0755 "$client_bin/$command"
          done
          echo "$client_bin" >> "$GITHUB_PATH"

      - name: Reconcile and snapshot staging baseline
        id: baseline
        if: steps.release.outputs.has_backend == 'true'
        working-directory: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE_MAINTENANCE_BINARY: ./target/release/scope-maintenance
          SCOPE_PRODUCTION_MIGRATION_PLAN: ${{ github.workspace }}/artifacts/production-migration-plan.json
          SCOPE_STAGING_BASELINE_DIR: ${{ runner.temp }}/staging-baseline
        run: bash .github/scripts/staging-baseline.sh

      - name: Retain staging baseline before migration
        if: steps.baseline.outputs.artifact_name != '' && !inputs.run_transition_tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.baseline.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/staging-baseline/database.dump
            ${{ runner.temp }}/staging-baseline/database.sha256
            ${{ runner.temp }}/staging-baseline/baseline.json
          retention-days: 7
          overwrite: true
          if-no-files-found: error

      - name: Deploy candidate once
        id: fence
        working-directory: candidate
        env:
          GITHUB_SHA: ${{ inputs.source_sha }}
          SCOPE_MAINTENANCE_BINARY: ./target/release/scope-maintenance
          SCOPE_STAGING_EVIDENCE_PATH: ${{ github.workspace }}/staging-deployments.json
        run: bash .github/scripts/deploy-staging-railway.sh

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.0 --activate

      - name: Install browser smoke dependencies
        working-directory: candidate/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Issue smoke login without resetting existing data
        working-directory: candidate
        env:
          SCOPE_SMOKE_SEED_BINARY: ./target/release/scope-smoke-seed
        run: bash .github/scripts/staging-smoke-seed.sh grant

      - name: Exercise optional release transitions
        if: inputs.run_transition_tests
        working-directory: candidate
        env:
          SCOPE_DEPLOYMENT_SOURCE_SHA: ${{ inputs.source_sha }}
          SCOPE_REHEARSAL_EVIDENCE_DIR: ${{ github.workspace }}/release-rehearsal
          SCOPE_STAGING_EVIDENCE_PATH: ${{ github.workspace }}/staging-deployments.json
        run: node .github/scripts/rehearse-release.mjs

      # These read existing fixtures after migration/restore. No candidate catalog reset
      # is allowed to replace the data whose survival this release must demonstrate.
      - name: Run browser smoke against staging
        working-directory: candidate/web
        env:
          SCOPE_SMOKE_REPO: dev/public-demo
        run: |
          web_domain="$(jq -er '.environments.staging.webDomain' ../../.github/deployment-services.json)"
          SCOPE_WEB_BASE_URL="https://$web_domain" pnpm test:smoke

      - name: Run Git router smoke against staging
        shell: bash
        env:
          GITHUB_SHA: ${{ inputs.source_sha }}
          SCOPE_CLI_BINARY: ${{ github.workspace }}/candidate/cli/target/release/scope
          SCOPE_MEDIA_SMOKE_SCRIPT: ${{ github.workspace }}/candidate/dev/media-smoke.mjs
          SCOPE_MEDIA_SMOKE_RECEIPT: ${{ github.workspace }}/staging-media-smoke.json
          SCOPE_MEDIA_SMOKE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          api_domain="$(jq -er '.environments.staging.apiDomain' .github/deployment-services.json)"
          router_domain="$(jq -er '.environments.staging.routerDomain' .github/deployment-services.json)"
          media_domain="$(jq -er '.mediaResources.staging.gatewayDomain' .github/deployment-services.json)"
          fixture_dir="$(mktemp -d "${RUNNER_TEMP}/scope-media-fixtures.XXXXXX")"
          trap 'rm -rf -- "$fixture_dir"' EXIT
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=blue:s=96x64 -frames:v 1 "$fixture_dir/fixture.png"
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=96x64:rate=12 -t 1 \
            -pix_fmt yuv420p "$fixture_dir/fixture.mp4"
          SCOPE_API_URL="https://$api_domain" \
            SCOPE_GIT_ROUTER_URL="https://$router_domain" \
            SCOPE_MEDIA_GATEWAY_URL="https://$media_domain" \
            SCOPE_MEDIA_SMOKE_PNG="$fixture_dir/fixture.png" \
            SCOPE_MEDIA_SMOKE_MP4="$fixture_dir/fixture.mp4" \
            SCOPE_EXCHANGE_TOKEN_PATH="$SCOPE_GIT_SMOKE_DIR/exchange-token" \
            bash .github/scripts/staging-git-smoke.sh

      - name: Bind media smoke receipt to staging evidence
        shell: bash
        run: |
          jq -e '.passed == true and .request_deleted == true' staging-media-smoke.json >/dev/null
          jq --slurpfile mediaSmoke staging-media-smoke.json \
            '. + {mediaSmoke: $mediaSmoke[0]}' staging-deployments.json > staging-deployments.json.tmp
          mv staging-deployments.json.tmp staging-deployments.json

      - name: Remove staging Git smoke credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${SCOPE_GIT_SMOKE_DIR:-}" && "$SCOPE_GIT_SMOKE_DIR" == "${RUNNER_TEMP}/"* ]]; then
            rm -rf -- "$SCOPE_GIT_SMOKE_DIR"
          fi

      - name: Upload release transition evidence
        if: always() && inputs.run_transition_tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-rehearsal-${{ inputs.source_sha }}
          path: release-rehearsal/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload staging deployment evidence
        if: always() && hashFiles('staging-deployments.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-deployments-${{ inputs.source_sha }}
          path: |
            staging-deployments.json
            staging-media-smoke.json
          if-no-files-found: error
          retention-days: 14

  cleanup:
    name: Revoke staging access
    needs: prove
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: staging
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SCOPE_RAILWAY_PROJECT_TOKEN_NAME: scope-staging-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout trusted cleanup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Load staging target from trusted manifest
        id: target
        shell: bash
        run: |
          {
            echo "SCOPE_RAILWAY_PROJECT_ID=$(jq -er '.railway.projectId' .github/deployment-services.json)"
            echo "SCOPE_RAILWAY_STAGING_ENVIRONMENT_ID=$(jq -er '.environments.staging.environmentId' .github/deployment-services.json)"
          } >> "$GITHUB_ENV"

      - name: Install Railway CLI
        run: |
          railway_cli_version="$(jq -r '.railway.cliVersion' .github/deployment-services.json)"
          npm install -g "@railway/cli@$railway_cli_version"

      # A failed migration or partial rollout may be incompatible with the old writers.
      # Keep staging fail-closed for diagnosis instead of automatically reviving them.
      - name: Keep staging writers fenced after unsuccessful deployment
        if: needs.prove.outputs.writers_fenced == 'true' && needs.prove.result != 'success' && needs.prove.result != 'skipped' && steps.target.outcome == 'success'
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          unset RAILWAY_TOKEN
          bash .github/scripts/stop-staging-writers.sh

      - name: Delete staging-scoped Railway token
        if: always()
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          unset RAILWAY_TOKEN
          bash .github/scripts/staging-railway-token.sh delete
