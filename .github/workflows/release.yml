name: Release

on:
  schedule:
    - cron: '0 15 * * 1-5'
  workflow_dispatch:
    inputs:
      scope:
        description: Deploy what changed since each service's last release, or everything
        type: choice
        default: changed
        options:
          - changed
          - all

concurrency:
  group: scope-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  plan:
    name: Plan selected components
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      backend_selected: ${{ steps.plan.outputs.backend_selected }}
      web: ${{ steps.plan.outputs.web }}
      cli: ${{ steps.plan.outputs.cli }}
      selected: ${{ steps.plan.outputs.selected }}
    steps:
      - name: Require main for releases
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read successful production revisions
        id: progress
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node deploy/scripts/production-deployment-progress.mjs read

      - name: Select affected components
        id: plan
        shell: bash
        env:
          REQUESTED_SCOPE: ${{ inputs.scope || 'changed' }}
          DEPLOYED_REVISIONS: ${{ steps.progress.outputs.revisions }}
        run: >-
          node deploy/scripts/plan-production-deployment.mjs
          --manifest .github/deployment-services.json
          --head "$GITHUB_SHA"
          --scope "$REQUESTED_SCOPE"
          --deployed-revisions "$DEPLOYED_REVISIONS"

  policy:
    name: Check repository policy
    needs: plan
    if: ${{ needs.plan.outputs.selected != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Check repository policy
        run: ./dev/checks/policy

  ops:
    name: Check operations
    needs: plan
    if: ${{ needs.plan.outputs.selected != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - name: Install PostgreSQL test server
        uses: ./.github/actions/install-test-postgres
      - name: Check operations
        env:
          SCOPE_TEST_POSTGRES_BIN: /usr/lib/postgresql/18/bin
          SCOPE_REQUIRE_POSTGRES_CLUSTER: '1'
        run: ./dev/checks/ops

  validation:
    name: Validate selected components
    needs: plan
    if: ${{ needs.plan.outputs.selected != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/validate.yml
    with:
      backend: ${{ needs.plan.outputs.backend_selected }}
      web: ${{ needs.plan.outputs.web }}
      cli: ${{ needs.plan.outputs.cli }}
      release_sha: ${{ github.sha }}
      release: true
      validate_server: false
    secrets: inherit

  server-validation:
    name: Validate server components
    needs: plan
    if: ${{ needs.plan.outputs.selected != '[]' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/validate-server.yml
    with:
      backend: ${{ needs.plan.outputs.backend_selected }}
      web: ${{ needs.plan.outputs.web }}
      release_sha: ${{ github.sha }}
      release: true
    secrets: inherit

  release-preparation:
    name: Prepare Railway artifacts
    needs: [plan, server-validation]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.server-validation.result == 'success' &&
      (needs.plan.outputs.backend_selected == 'true' || needs.plan.outputs.web == 'true')
    permissions:
      actions: read
      contents: read
      deployments: read
      packages: write
    uses: ./.github/workflows/prepare-release.yml
    with:
      source_sha: ${{ github.sha }}
      prepare_backend: ${{ needs.plan.outputs.backend_selected == 'true' }}
      prepare_web: ${{ needs.plan.outputs.web == 'true' }}
      media_worker_image: ${{ needs.server-validation.outputs.media_worker_image || '' }}
    secrets: inherit

  cli-release:
    name: CLI release
    needs: [plan, policy, ops, validation]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.policy.result == 'success' && needs.ops.result == 'success' &&
      needs.validation.result == 'success' &&
      needs.plan.outputs.cli == 'true'
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-cli.yml
    secrets: inherit

  production-deploy:
    name: Deploy production
    needs: [plan, policy, ops, validation, release-preparation, cli-release]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.policy.result == 'success' && needs.ops.result == 'success' &&
      needs.validation.result == 'success' &&
      needs.release-preparation.result == 'success' &&
      (needs.cli-release.result == 'success' || needs.cli-release.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    permissions:
      actions: read
      contents: read
      deployments: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26

      - name: Download prepared release images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: prepared-release-${{ github.sha }}
          path: artifacts

      - name: Download maintenance binary
        if: needs.plan.outputs.backend_selected == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-release-${{ github.sha }}
          path: artifacts

      - name: Extract maintenance binary
        if: needs.plan.outputs.backend_selected == 'true'
        run: |
          mkdir -p artifacts/backend
          python3 deploy/scripts/extract-railway-release.py backend artifacts/backend-release.tar.gz artifacts/backend

      - uses: ./.github/actions/install-railway-cli

      - name: Migrate and deploy production images
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SCOPE_RAILWAY_SSH_PRIVATE_KEY: ${{ secrets.SCOPE_RAILWAY_SSH_PRIVATE_KEY }}
          SCOPE_RAILWAY_REGISTRY_USERNAME: ${{ secrets.RAILWAY_REGISTRY_USERNAME }}
          SCOPE_RAILWAY_REGISTRY_PASSWORD: ${{ secrets.RAILWAY_REGISTRY_PASSWORD }}
          SCOPE_PREPARED_RELEASE_PATH: artifacts/prepared-release.json
          SCOPE_RELEASE_COMPONENTS: ${{ needs.plan.outputs.selected }}
          SCOPE_MAINTENANCE_BINARY: artifacts/backend/scope-maintenance
          SCOPE_DEPLOYMENT_SOURCE_SHA: ${{ github.sha }}
          SCOPE_DEPLOYMENT_EVIDENCE_PATH: production-deployments.ndjson
        run: bash deploy/scripts/deploy-production-railway.sh

      - name: Add the CLI release once the web that serves it is verified
        if: needs.cli-release.result == 'success'
        env:
          TAG: ${{ needs.cli-release.outputs.tag }}
        run: >-
          jq -cn --arg sourceSha "$GITHUB_SHA" --arg evidenceId "$TAG"
          '{component: "cli-release", sourceSha: $sourceSha, provider: "github-release", evidenceId: $evidenceId}'
          >> production-deployments.ndjson

      - name: Record each service that deployed
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node deploy/scripts/production-deployment-progress.mjs record-file \
            --file production-deployments.ndjson \
            --log-url "$LOG_URL"

  scheduled-failure-report:
    name: Report a failed scheduled release
    needs: [plan, policy, ops, validation, server-validation, release-preparation, cli-release, production-deploy]
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report failure without duplicate issues
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          retries: 3
          script: |
            const { reportIssue } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/report-issue.mjs`);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await reportIssue({
              github, ...context.repo,
              title: 'Scheduled release failed',
              body: `The scheduled release of ${context.sha} failed: ${runUrl}. Run Release again once main is fixed.`,
            });
