name: Rust Workspace Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SCOPE_TEST_DATABASE_URL: postgres://scope:scope@127.0.0.1:5432/scope_test

jobs:
  checks:
    name: Check Rust workspace
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scope_test
          POSTGRES_PASSWORD: scope
          POSTGRES_USER: scope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scope -d scope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
          shared-key: workspace
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      # This server lives for one job. Without fsync a checkpoint is instant, and
      # every test database the suite drops has to wait for one.
      - name: Trade Postgres durability for speed
        run: |
          docker exec "${{ job.services.postgres.id }}" psql --username=scope --dbname=scope_test \
            --set=ON_ERROR_STOP=1 \
            --command="ALTER SYSTEM SET fsync = off" \
            --command="ALTER SYSTEM SET synchronous_commit = off" \
            --command="SELECT pg_reload_conf()"

      - name: Check Rust workspace
        run: ./dev/checks/backend

      - name: Enable pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.1.0

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Check generated API TypeScript contract
        run: ./dev/checks/contract
