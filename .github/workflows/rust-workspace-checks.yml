name: Rust Workspace Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint Rust workspace and contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: workspace-lint
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

      - name: Install cargo-deny
        run: ./dev/install-cargo-deny.sh

      - name: Lint Rust workspace
        run: ./dev/checks/backend lint

      - name: Install Lean
        uses: ./.github/actions/install-lean

      - name: Check the projection against its Lean model
        run: ./dev/checks/projection-model

      - name: Enable pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.1.0

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Check generated API TypeScript contract
        run: ./dev/checks/contract

  tests:
    name: Test Rust workspace (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [workspace, api-git-refs, api, features]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.1

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: workspace-tests-${{ matrix.lane == 'workspace' && 'workspace' || 'api' }}
          save-if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (matrix.lane == 'workspace' || matrix.lane == 'api') }}

      - name: Install PostgreSQL test server
        run: sudo ./dev/install-test-postgres.sh

      - name: Test Rust workspace lane
        env:
          SCOPE_TEST_POSTGRES_BIN: /usr/lib/postgresql/18/bin
        run: ./dev/checks/backend ${{ matrix.lane }}
