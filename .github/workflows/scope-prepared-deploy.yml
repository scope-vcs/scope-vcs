name: Deploy Prepared Production Release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Production workflow run that prepared the release
        type: string
        required: true
      maintenance_budget_seconds:
        description: Approved outage budget; 0 prevents a new maintenance cutover
        type: number
        default: 0

concurrency:
  group: scope-production-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  prepare:
    name: Validate prepared release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      deployments: ${{ steps.progress.outputs.deployments }}
      revisions: ${{ steps.progress.outputs.revisions }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Require trusted main dispatch
        run: test "$GITHUB_REF" = refs/heads/main

      - name: Checkout trusted deployment orchestration
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Resolve source run revision
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          source_sha="$(gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq .head_sha)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Download exact prepared release
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          name: prepared-release-${{ steps.run.outputs.source_sha }}
          path: source-release

      - name: Validate source and prepared release
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: >-
          node .github/scripts/prepared-deploy-trust.mjs
          "$SOURCE_RUN_ID"
          source-release/prepared-release.json

      - name: Read successful production revisions
        id: progress
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/production-deployment-progress.mjs read

      - name: Re-publish validated release manifest for this run
        uses: actions/upload-artifact@v7
        with:
          name: prepared-release-${{ steps.source.outputs.source_sha }}
          path: source-release/prepared-release.json
          if-no-files-found: error
          retention-days: 90

  backend-deploy:
    name: Backend deploy
    needs: prepare
    permissions:
      actions: read
      contents: read
      deployments: write
    uses: ./.github/workflows/scope-api-deploy.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      deploy_cache: true
      deploy_worker: true
      deploy_media_worker: true
      deploy_router: true
      deploy_media: true
      deploy_api: true
      successful_deployments: ${{ needs.prepare.outputs.deployments }}
      maintenance_budget_seconds: ${{ fromJSON(format('{0}', inputs.maintenance_budget_seconds || 0)) }}
    secrets: inherit

  web-deploy:
    name: Web deploy
    needs: [prepare, backend-deploy]
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/scope-web-deploy.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      verified_successful_sha: ${{ fromJSON(needs.prepare.outputs.revisions || '{}').web || '' }}
    secrets: inherit

  cli-deploy:
    name: CLI deploy
    needs: [prepare, backend-deploy]
    permissions:
      actions: read
      contents: read
      deployments: write
    uses: ./.github/workflows/scope-cli-deploy.yml
    with:
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      artifact_run_id: ${{ inputs.source_run_id }}
      verified_successful_sha: ${{ fromJSON(needs.prepare.outputs.revisions || '{}').cli || '' }}
    secrets: inherit
