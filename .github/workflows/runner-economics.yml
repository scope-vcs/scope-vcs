name: Runner economics experiment

on:
  push:
    branches: [experiment/runner-economics]
    paths:
      - .github/workflows/runner-economics.yml
      - '.scope/runs/economics-*.yml'
      - dev/runner-economics/measure.mjs
      - dev/checks/backend
      - Cargo.toml
      - Cargo.lock
      - 'worker/**/*.rs'
      - 'api/**/*.rs'
      - 'crates/**/*.rs'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_HOME: /home/runner/runner-economics-cargo
  CARGO_TARGET_DIR: /home/runner/runner-economics-target
  RUSTUP_TOOLCHAIN: 1.98.0-x86_64-unknown-linux-gnu
  SCOPE_TEST_DATABASE_URL: postgres://scope:scope@127.0.0.1:5432/scope_test
  BENCH_RUNNER: github-ubuntu-24.04
  BENCH_OUTPUT: /tmp/runner-economics

jobs:
  cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scope_test
          POSTGRES_PASSWORD: scope
          POSTGRES_USER: scope
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U scope -d scope_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d9289bd7737a22251c99dce9a7138f88cc9c4b06
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Full backend workload, empty Cargo cache
        env:
          BENCH_CACHE: cold
          BENCH_SAMPLE: ${{ matrix.sample }}
        run: node dev/runner-economics/measure.mjs
      - uses: actions/cache/save@v5
        if: matrix.sample == 1
        with:
          path: |
            /home/runner/runner-economics-cargo
            /home/runner/runner-economics-target
          key: runner-economics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: github-cold-${{ matrix.sample }}
          path: /tmp/runner-economics
          retention-days: 14
  warm:
    needs: cold
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scope_test
          POSTGRES_PASSWORD: scope
          POSTGRES_USER: scope
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U scope -d scope_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: d9289bd7737a22251c99dce9a7138f88cc9c4b06
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: actions/cache/restore@v5
        with:
          path: |
            /home/runner/runner-economics-cargo
            /home/runner/runner-economics-target
          key: runner-economics-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Full backend workload, restored Cargo cache on fresh VM
        env:
          BENCH_CACHE: restored
          BENCH_SAMPLE: ${{ matrix.sample }}
        run: node dev/runner-economics/measure.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: github-restored-${{ matrix.sample }}
          path: /tmp/runner-economics
          retention-days: 14
