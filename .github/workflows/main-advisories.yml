name: Daily dependency advisories on main

on:
  schedule:
    - cron: '41 8 * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: main-dependency-advisories
  cancel-in-progress: false

jobs:
  advisories:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.1

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 26

      - name: Install cargo-deny
        run: ./dev/install-cargo-deny.sh

      - name: Check main dependency advisories
        run: node .github/scripts/main-advisories.mjs "$RUNNER_TEMP/main-advisories.json"

      - name: Report failure without duplicate issues
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { existsSync, readFileSync } = await import('node:fs');
            const { reportMainAdvisories } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/main-advisories.mjs`);
            const path = `${process.env.RUNNER_TEMP}/main-advisories.json`;
            await reportMainAdvisories({
              github, ...context.repo,
              checks: existsSync(path) ? JSON.parse(readFileSync(path, 'utf8')) : [],
              runUrl: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              sha: context.sha,
            });
