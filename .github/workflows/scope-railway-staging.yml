name: Scope Railway staging proof
run-name: Scope staging ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact repository commit SHA to deploy
        type: string
        required: true
      run_media_capacity:
        description: Run the large-video and concurrent-photo staging capacity proof
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: scope-railway-staging
  cancel-in-progress: false

jobs:
  media-worker-image:
    name: Build candidate media worker
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/scope-media-worker-image.yml
    with:
      publish: true
      source_sha: ${{ inputs.source_sha }}

  prove:
    name: Deploy and smoke staging
    needs: media-worker-image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    environment: staging
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SCOPE_RAILWAY_PROJECT_TOKEN_NAME: scope-staging-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Validate requested revision
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a lowercase 40-character commit SHA." >&2
            exit 2
          fi

      - name: Checkout trusted orchestration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Load staging target from trusted manifest
        shell: bash
        run: |
          {
            echo "SCOPE_RAILWAY_PROJECT_ID=$(jq -er '.railway.projectId' .github/deployment-services.json)"
            echo "SCOPE_RAILWAY_STAGING_ENVIRONMENT_ID=$(jq -er '.railway.staging.environmentId' .github/deployment-services.json)"
          } >> "$GITHUB_ENV"

      - name: Install Railway CLI
        run: |
          railway_cli_version="$(jq -r '.railway.cliVersion' .github/deployment-services.json)"
          npm install -g "@railway/cli@$railway_cli_version"

      - name: Create staging-scoped Railway token
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: bash .github/scripts/staging-railway-token.sh create

      - name: Configure private media worker registry access
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ env.SCOPE_RAILWAY_PROJECT_ID }}
          SCOPE_RAILWAY_ENVIRONMENT_ID: ${{ env.SCOPE_RAILWAY_STAGING_ENVIRONMENT_ID }}
          SCOPE_RAILWAY_REGISTRY_USERNAME: ${{ secrets.RAILWAY_REGISTRY_USERNAME }}
          SCOPE_RAILWAY_REGISTRY_PASSWORD: ${{ secrets.RAILWAY_REGISTRY_PASSWORD }}
        run: |
          unset RAILWAY_TOKEN
          service_id="$(jq -er '.services.mediaWorker.id | strings | select(length > 0)' .github/deployment-services.json)"
          node .github/scripts/deploy-railway-image.mjs configure-registry "$service_id"

      - name: Close staging writers
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          unset RAILWAY_TOKEN
          bash .github/scripts/stop-staging-writers.sh

      # Candidate code is introduced only after privileged account-token work is complete.
      - name: Checkout exact candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          path: candidate
          ref: ${{ inputs.source_sha }}

      - name: Verify checked out candidate revision
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: 1.98.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
          shared-key: staging-proof
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            candidate -> target
            candidate/cli -> target

      - name: Build staging commands
        working-directory: candidate
        run: |
          cargo build --release --locked -p api --bin scope-maintenance
          cargo build --release --locked -p api --bin scope-smoke-seed --features smoke-seed
          cargo build --release --locked -p scope-media-service
          cargo build --release --locked --manifest-path cli/Cargo.toml --bin scope

      - name: Stage exact upload roots
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          rm -rf .railway-staging-upload
          for service in api worker cache-service repo-router; do
            root=".railway-staging-upload/$service"
            mkdir -p "$root"
            cp candidate/Cargo.toml candidate/Cargo.lock candidate/rust-toolchain.toml "$root/"
            cp candidate/LICENSE candidate/NOTICE "$root/"
            mkdir -p "$root/legal"
            cp candidate/legal/third-party-rust.txt "$root/legal/"
            cp "candidate/$service/railpack.json" "$root/railpack.json"
            cp "candidate/$service/railway.json" "$root/railway.json"
            cp -a candidate/api candidate/cache-service candidate/media-service candidate/media-worker candidate/repo-router candidate/worker candidate/crates candidate/runner-runtime "$root/"
            printf '%s\n' "$SOURCE_SHA" > "$root/$service/.scope-deployment-sha"
            printf '%s:%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$root/$service/.scope-deployment-attempt"
          done
          media_root=.railway-staging-upload/media-service
          mkdir -p "$media_root/bin" "$media_root/media-service"
          install -m 0755 candidate/target/release/scope-media-service "$media_root/bin/scope-media-service"
          install -m 0755 candidate/deploy/railway/start-prebuilt.sh "$media_root/start.sh"
          cp candidate/deploy/railway/prebuilt-media.railpack.json "$media_root/railpack.json"
          cp candidate/media-service/railway.json "$media_root/railway.json"
          printf '%s\n' "$SOURCE_SHA" | tee \
            "$media_root/.scope-deployment-sha" \
            "$media_root/media-service/.scope-deployment-sha" >/dev/null
          printf '%s:%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | tee \
            "$media_root/.scope-deployment-attempt" \
            "$media_root/media-service/.scope-deployment-attempt" >/dev/null
          region="$(jq -er '.railway.regionId' .github/deployment-services.json)"
          api_replicas="$(jq -er '.railway.staging.apiReplicas' .github/deployment-services.json)"
          router_replicas="$(jq -er '.railway.staging.routerReplicas' .github/deployment-services.json)"
          jq --arg region "$region" --argjson replicas "$api_replicas" \
            '.deploy.multiRegionConfig = {($region): {numReplicas: $replicas}}' \
            .railway-staging-upload/api/railway.json > .railway-staging-upload/api/railway.json.tmp
          mv .railway-staging-upload/api/railway.json.tmp .railway-staging-upload/api/railway.json
          jq --arg region "$region" --argjson replicas "$router_replicas" \
            '.deploy.multiRegionConfig = {($region): {numReplicas: $replicas}}' \
            .railway-staging-upload/repo-router/railway.json > .railway-staging-upload/repo-router/railway.json.tmp
          mv .railway-staging-upload/repo-router/railway.json.tmp .railway-staging-upload/repo-router/railway.json
          mkdir -p .railway-staging-upload/web-root/web
          cp -a candidate/web/. .railway-staging-upload/web-root/web/
          cp candidate/web/railway.json .railway-staging-upload/web-root/railway.json
          printf '%s\n' "$SOURCE_SHA" > .railway-staging-upload/web-root/web/.scope-deployment-sha
          printf '%s:%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .railway-staging-upload/web-root/web/.scope-deployment-attempt
          test -s .railway-staging-upload/api/api/.scope-deployment-sha
          test -s .railway-staging-upload/worker/worker/.scope-deployment-sha
          test -s .railway-staging-upload/cache-service/cache-service/.scope-deployment-sha
          test -s .railway-staging-upload/repo-router/repo-router/.scope-deployment-sha
          for root in api worker cache-service repo-router; do
            while IFS= read -r manifest; do
              test -s ".railway-staging-upload/$root/$manifest/Cargo.toml"
            done < <(sed -n 's/^[[:space:]]*"\([^"]*\)",[[:space:]]*$/\1/p' candidate/Cargo.toml)
          done
          test -s .railway-staging-upload/web-root/web/.scope-deployment-sha
          test -s .railway-staging-upload/web-root/web/package.json
          test -s .railway-staging-upload/web-root/railway.json
          test -x .railway-staging-upload/media-service/bin/scope-media-service

      - name: Migrate, seed, and deploy staging services
        shell: bash
        env:
          GITHUB_SHA: ${{ inputs.source_sha }}
          SCOPE_MAINTENANCE_BINARY: ./candidate/target/release/scope-maintenance
          SCOPE_SMOKE_SEED_BINARY: ./candidate/target/release/scope-smoke-seed
          SCOPE_MEDIA_WORKER_IMAGE: ${{ needs.media-worker-image.outputs.image_ref }}
        run: |
          smoke_dir="$(mktemp -d "${RUNNER_TEMP}/scope-staging-git-smoke.XXXXXX")"
          chmod 0700 "$smoke_dir"
          echo "SCOPE_GIT_SMOKE_DIR=$smoke_dir" >> "$GITHUB_ENV"
          export SCOPE_SMOKE_SEED_EXCHANGE_TOKEN_PATH="$smoke_dir/exchange-token"
          bash .github/scripts/deploy-staging-railway.sh prepare \
            .railway-staging-upload/cache-service \
            .railway-staging-upload/worker \
            .railway-staging-upload/api \
            .railway-staging-upload/repo-router \
            .railway-staging-upload/media-service

      - name: Deploy staging web and record evidence
        shell: bash
        env:
          GITHUB_SHA: ${{ inputs.source_sha }}
          SCOPE_STAGING_EVIDENCE_PATH: staging-deployments.json
          SCOPE_MEDIA_WORKER_IMAGE: ${{ needs.media-worker-image.outputs.image_ref }}
        run: |
          bash .github/scripts/deploy-staging-railway.sh finish \
            .railway-staging-upload/web-root

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.0 --activate

      - name: Install browser smoke dependencies
        working-directory: candidate/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke against staging
        working-directory: candidate/web
        env:
          SCOPE_SMOKE_REPO: dev/public-demo
        run: |
          web_domain="$(jq -er '.railway.staging.webDomain' ../../.github/deployment-services.json)"
          SCOPE_WEB_BASE_URL="https://$web_domain" pnpm test:smoke

      - name: Run Git router smoke against staging
        shell: bash
        env:
          GITHUB_SHA: ${{ inputs.source_sha }}
          RUN_MEDIA_CAPACITY: ${{ inputs.run_media_capacity }}
          SCOPE_CLI_BINARY: ${{ github.workspace }}/candidate/cli/target/release/scope
          SCOPE_MEDIA_SMOKE_SCRIPT: ${{ github.workspace }}/candidate/dev/media-smoke.mjs
          SCOPE_MEDIA_SMOKE_RECEIPT: ${{ github.workspace }}/staging-media-smoke.json
          SCOPE_MEDIA_SMOKE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          api_domain="$(jq -er '.railway.staging.apiDomain' .github/deployment-services.json)"
          router_domain="$(jq -er '.railway.staging.routerDomain' .github/deployment-services.json)"
          media_domain="$(jq -er '.mediaResources.staging.gatewayDomain' .github/deployment-services.json)"
          fixture_dir="$(mktemp -d "${RUNNER_TEMP}/scope-media-fixtures.XXXXXX")"
          trap 'rm -rf -- "$fixture_dir"' EXIT
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=blue:s=96x64 -frames:v 1 "$fixture_dir/fixture.png"
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=96x64:rate=12 -t 1 \
            -pix_fmt yuv420p "$fixture_dir/fixture.mp4"
          if [[ "$RUN_MEDIA_CAPACITY" == "true" ]]; then
            ffmpeg -hide_banner -loglevel error -y \
              -f lavfi -i testsrc2=size=1920x1080:rate=30 \
              -f lavfi -i sine=frequency=1000:sample_rate=48000 \
              -t 240 -c:v libx264 -threads 2 -preset ultrafast \
              -b:v 17M -minrate 17M -maxrate 17M -bufsize 34M \
              -x264-params 'nal-hrd=cbr:force-cfr=1' \
              -c:a aac -b:a 128k -movflags +faststart \
              "$fixture_dir/capacity-recording.mp4"
            export SCOPE_MEDIA_CAPACITY_SCRIPT="$GITHUB_WORKSPACE/candidate/dev/media-capacity.mjs"
            export SCOPE_MEDIA_CAPACITY_VIDEO="$fixture_dir/capacity-recording.mp4"
            export SCOPE_MEDIA_CAPACITY_RECEIPT="$GITHUB_WORKSPACE/staging-media-capacity/receipt.json"
          fi
          SCOPE_API_URL="https://$api_domain" \
            SCOPE_GIT_ROUTER_URL="https://$router_domain" \
            SCOPE_MEDIA_GATEWAY_URL="https://$media_domain" \
            SCOPE_MEDIA_SMOKE_PNG="$fixture_dir/fixture.png" \
            SCOPE_MEDIA_SMOKE_MP4="$fixture_dir/fixture.mp4" \
            SCOPE_EXCHANGE_TOKEN_PATH="$SCOPE_GIT_SMOKE_DIR/exchange-token" \
            bash .github/scripts/staging-git-smoke.sh

      - name: Bind media smoke receipt to staging evidence
        shell: bash
        env:
          RUN_MEDIA_CAPACITY: ${{ inputs.run_media_capacity }}
        run: |
          jq -e '.passed == true and .request_deleted == true' staging-media-smoke.json >/dev/null
          jq --slurpfile mediaSmoke staging-media-smoke.json \
            '. + {mediaSmoke: $mediaSmoke[0]}' staging-deployments.json > staging-deployments.json.tmp
          mv staging-deployments.json.tmp staging-deployments.json
          if [[ "$RUN_MEDIA_CAPACITY" == "true" ]]; then
            jq -e --arg sha '${{ inputs.source_sha }}' \
              '.passed == true and .source_sha == $sha and .loaded.failed_requests == 0' \
              staging-media-capacity/receipt.json >/dev/null
            jq --slurpfile mediaCapacity staging-media-capacity/receipt.json \
              '. + {mediaCapacity: $mediaCapacity[0]}' \
              staging-deployments.json > staging-deployments.json.tmp
            mv staging-deployments.json.tmp staging-deployments.json
          fi

      - name: Remove staging Git smoke credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${SCOPE_GIT_SMOKE_DIR:-}" && "$SCOPE_GIT_SMOKE_DIR" == "${RUNNER_TEMP}/"* ]]; then
            rm -rf -- "$SCOPE_GIT_SMOKE_DIR"
          fi

      - name: Upload staging deployment evidence
        if: always() && hashFiles('staging-deployments.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-deployments-${{ inputs.source_sha }}
          path: |
            staging-deployments.json
            staging-media-smoke.json
            staging-media-capacity/*.json
          if-no-files-found: error
          retention-days: 14

  cleanup:
    name: Revoke staging proof access
    needs: prove
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: staging
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SCOPE_RAILWAY_PROJECT_TOKEN_NAME: scope-staging-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout trusted cleanup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Load staging target from trusted manifest
        shell: bash
        run: |
          {
            echo "SCOPE_RAILWAY_PROJECT_ID=$(jq -er '.railway.projectId' .github/deployment-services.json)"
            echo "SCOPE_RAILWAY_STAGING_ENVIRONMENT_ID=$(jq -er '.railway.staging.environmentId' .github/deployment-services.json)"
          } >> "$GITHUB_ENV"

      - name: Install Railway CLI
        run: |
          railway_cli_version="$(jq -r '.railway.cliVersion' .github/deployment-services.json)"
          npm install -g "@railway/cli@$railway_cli_version"

      # A failed migration or partial rollout may be incompatible with the old writers.
      # Keep staging fail-closed for diagnosis instead of automatically reviving them.
      - name: Keep staging writers fenced after unsuccessful proof
        if: needs.prove.result != 'success'
        shell: bash
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          unset RAILWAY_TOKEN
          bash .github/scripts/stop-staging-writers.sh

      - name: Delete staging-scoped Railway token
        if: always()
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          unset RAILWAY_TOKEN
          bash .github/scripts/staging-railway-token.sh delete
