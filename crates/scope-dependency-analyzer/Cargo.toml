[package]
name = "scope-dependency-analyzer"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/adamblumoff/scope-vcs"

[dependencies]
json-strip-comments = "3.1.2"
oxc_allocator = "=0.155.0"
oxc_ast = "=0.155.0"
oxc_ast_visit = "=0.155.0"
oxc_parser = "=0.155.0"
oxc_resolver = { version = "=11.24.3", default-features = false }
oxc_span = "=0.155.0"
rayon = "1.12.0"
scope_domain = { package = "scope-domain", path = "../scope-domain" }
serde = "1.0.228"
serde_json = { version = "1.0.147", features = ["raw_value"] }

[dev-dependencies]
tempfile = "3.23.0"
