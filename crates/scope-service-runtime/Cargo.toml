[package]
name = "scope-service-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
postgres = ["dep:scope_postgres"]
test-support = []

[dependencies]
anyhow.workspace = true
axum.workspace = true
axum-tracing-opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
bytes.workspace = true
getrandom.workspace = true
hex.workspace = true
http.workspace = true
http-body = "1.0"
jsonwebtoken.workspace = true
opentelemetry.workspace = true
opentelemetry-http.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
reqwest = { workspace = true, features = ["blocking", "rustls"] }
scope_api_contract.workspace = true
scope_postgres = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "signal", "time"] }
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
url = "2.5.8"

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread", "time"] }
