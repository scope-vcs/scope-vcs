[package]
name = "scope-api-contract"
publish = false
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/adamblumoff/scope-vcs"

[features]
default = []
ts = ["dep:schemars", "dep:ts-rs"]

[dependencies]
scope_domain = { package = "scope-domain", path = "../scope-domain" }
serde = { version = "1.0.228", features = ["derive"] }
schemars = { version = "1.2.1", optional = true }
ts-rs = { version = "12.0.1", optional = true }

serde_json = "1.0.147"

[lints.rust]
unreachable_pub = "warn"
unsafe_code = "warn"

[lints.clippy]
allow_attributes = "warn"
dbg_macro = "warn"
let_underscore_must_use = "warn"
match_same_arms = "warn"
redundant_clone = "warn"
todo = "warn"
unimplemented = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"
unused_self = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"
