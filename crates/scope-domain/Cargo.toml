[package]
name = "scope-domain"
publish = false
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/adamblumoff/scope-vcs"

[dependencies]
hex = "0.4.3"
pulldown-cmark = { version = "0.13.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.18"
url = "2.5.8"

[lints.rust]
unreachable_pub = "warn"
unsafe_code = "warn"

[lints.clippy]
allow_attributes = "warn"
dbg_macro = "warn"
expect_used = "warn"
let_underscore_must_use = "warn"
match_same_arms = "warn"
redundant_clone = "warn"
todo = "warn"
unimplemented = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"
unused_self = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"
