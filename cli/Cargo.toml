[package]
name = "scope-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/adamblumoff/scope-vcs"

[[bin]]
name = "scope"
path = "src/bin/scope.rs"

[[bin]]
name = "scope-cli-service"
path = "src/bin/scope-cli-service.rs"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.7"
clap = { version = "4.6.0", features = ["derive"] }
clap_complete = "4.6.0"
crossterm = "0.29.0"
ctrlc = "3.4"
getrandom = "0.3.4"
hex = "0.4.3"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "0.12.26", default-features = false, features = ["blocking", "json", "rustls-tls"] }
scope_domain = { package = "scope-domain", path = "../crates/scope-domain" }
scope_api_contract = { package = "scope-api-contract", path = "../crates/scope-api-contract" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
sha2 = "0.10.9"
tempfile = "3.23.0"
time = { version = "0.3.44", features = ["parsing"] }
tokio = { version = "1.48.0", features = ["fs", "macros", "net", "rt-multi-thread"] }
unicode-width = "0.2.2"
webbrowser = "1.0.6"

[target.'cfg(any(target_os = "macos", windows))'.dependencies]
keyring-core = "1.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Keep the CLI independent when a checkout is nested inside another workspace.
[workspace]
