AWSTemplateFormatVersion: "2010-09-09"
Description: Scope production Fargate runner infrastructure

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedPattern: "^[a-z0-9-]+$"
  VpcCidr:
    Type: String
    Default: 10.42.0.0/16
  PublicSubnetOneCidr:
    Type: String
    Default: 10.42.0.0/20
  PublicSubnetTwoCidr:
    Type: String
    Default: 10.42.16.0/20
  BudgetNotificationEmail:
    Type: String
    Default: ""
    Description: Leave empty to omit the monthly project budget.
  MonthlyBudgetUsd:
    Type: Number
    Default: 100
    MinValue: 1
  GitHubRepository:
    Type: String
    Default: scope-vcs/scope-vcs
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    Description: GitHub owner and repository allowed to publish checks images.
  GitHubRepositoryId:
    Type: String
    Default: "1272896256"
    AllowedPattern: "^[0-9]+$"
    Description: Immutable GitHub repository ID allowed to publish checks images.
  GitHubRepositoryOwnerId:
    Type: String
    Default: "321219119"
    AllowedPattern: "^[0-9]+$"
    Description: Immutable GitHub repository owner ID used in OIDC subjects.
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: Supply the account's token.actions.githubusercontent.com provider ARN, or leave empty for this stack to create it.
  RegistryCredentialsSecretArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:(aws|aws-us-gov|aws-cn):secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:[A-Za-z0-9/_+=.@-]+$"
    Description: Optional Secrets Manager ARN containing private registry username and password JSON.

Conditions:
  HasBudgetNotification: !Not [!Equals [!Ref BudgetNotificationEmail, ""]]
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, ""]
  UseExistingGitHubOidcProvider: !Not [!Equals [!Ref ExistingGitHubOidcProviderArn, ""]]
  HasRegistryCredentialsSecret: !Not [!Equals [!Ref RegistryCredentialsSecretArn, ""]]

Resources:
  RunnerVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub scope-vcs-${Environment}-runner

  RunnerInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub scope-vcs-${Environment}-runner

  RunnerInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref RunnerInternetGateway
      VpcId: !Ref RunnerVpc

  RunnerPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref RunnerVpc
      Tags:
        - Key: Name
          Value: !Sub scope-vcs-${Environment}-runner-public

  RunnerPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: RunnerInternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref RunnerInternetGateway
      RouteTableId: !Ref RunnerPublicRouteTable

  RunnerPublicSubnetOne:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PublicSubnetOneCidr
      MapPublicIpOnLaunch: true
      VpcId: !Ref RunnerVpc
      Tags:
        - Key: Name
          Value: !Sub scope-vcs-${Environment}-runner-public-a

  RunnerPublicSubnetTwo:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PublicSubnetTwoCidr
      MapPublicIpOnLaunch: true
      VpcId: !Ref RunnerVpc
      Tags:
        - Key: Name
          Value: !Sub scope-vcs-${Environment}-runner-public-b

  RunnerPublicSubnetOneRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RunnerPublicRouteTable
      SubnetId: !Ref RunnerPublicSubnetOne

  RunnerPublicSubnetTwoRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref RunnerPublicRouteTable
      SubnetId: !Ref RunnerPublicSubnetTwo

  RunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound HTTPS for Scope Fargate runner tasks
      SecurityGroupEgress:
        - Description: HTTPS to the Scope API, cache, source hosts, and image registry
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      VpcId: !Ref RunnerVpc
      Tags:
        - Key: Name
          Value: !Sub scope-vcs-${Environment}-runner

  RunnerCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub scope-vcs-${Environment}-runner
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  RunnerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /scope-vcs/${Environment}/cloud-runner
      RetentionInDays: 14

  ChecksImageRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub scope-vcs/${Environment}/checks
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Delete untagged artifacts after fourteen days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": {"type": "expire"}
              }
            ]
          }
      Tags:
        - Key: Component
          Value: checks-image

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Component
          Value: checks-image

  ChecksImagePublisherRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-github-checks-publisher
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - UseExistingGitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
                - !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:repository_id: !Ref GitHubRepositoryId
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub
                  - repo:${RepositoryOwner}@${GitHubRepositoryOwnerId}/${RepositoryName}@${GitHubRepositoryId}:ref:refs/heads/*
                  - RepositoryOwner: !Select [0, !Split ["/", !Ref GitHubRepository]]
                    RepositoryName: !Select [1, !Split ["/", !Ref GitHubRepository]]
                token.actions.githubusercontent.com:job_workflow_ref: !Sub ${GitHubRepository}/.github/workflows/scope-checks-image.yml@refs/heads/*
      Policies:
        - PolicyName: publish-checks-images
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ChecksImageRepository.Arn
      Tags:
        - Key: Component
          Value: checks-image

  GitHubInfrastructureRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-github-infrastructure
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - UseExistingGitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
                - !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:repository_id: !Ref GitHubRepositoryId
                token.actions.githubusercontent.com:sub: !Sub
                  - repo:${RepositoryOwner}@${GitHubRepositoryOwnerId}/${RepositoryName}@${GitHubRepositoryId}:environment:AWS-infrastructure
                  - RepositoryOwner: !Select [0, !Split ["/", !Ref GitHubRepository]]
                    RepositoryName: !Select [1, !Split ["/", !Ref GitHubRepository]]
                token.actions.githubusercontent.com:ref: refs/heads/main
                token.actions.githubusercontent.com:job_workflow_ref: !Sub ${GitHubRepository}/.github/workflows/scope-aws-infrastructure-execute.yml@refs/heads/main
      Policies:
        - PolicyName: scoped-infrastructure-changes
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: "*"
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/scope-cloud-runner-production/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/scope-dispatch-broker-production/*
                Condition:
                  ArnEquals:
                    cloudformation:RoleArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/scope-infrastructure-execution
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/scope-cloud-runner-production/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/scope-dispatch-broker-production/*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/scope-infrastructure-execution
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
      Tags:
        - Key: Component
          Value: infrastructure

  RunnerTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/scope-runtime-boundary
      RoleName: !Sub ${AWS::StackName}-task-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: write-runner-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${RunnerLogGroup.Arn}:*'
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:scope-vcs/${RunnerCluster}/attempts/*
              - !If
                - HasRegistryCredentialsSecret
                - Sid: ReadPrivateRegistryCredentials
                  Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref RegistryCredentialsSecretArn
                - !Ref AWS::NoValue
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt ChecksImageRepository.Arn

  RailwayDispatcherUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub ${AWS::StackName}-railway-dispatcher

  RailwayDispatcherPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Invoke the validated Scope dispatch broker from Railway
      Users:
        - !Ref RailwayDispatcherUser
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InvokeDispatchBroker
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:scope-cloud-runner-${Environment}-dispatch-broker

  RunnerBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetNotification
    Properties:
      Budget:
        BudgetName: !Sub scope-vcs-${Environment}-cloud-runner
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        BudgetType: COST
        CostFilters:
          TagKeyValue:
            - user:Project$scope-vcs
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref BudgetNotificationEmail
              SubscriptionType: EMAIL

Outputs:
  AwsRegion:
    Description: Worker AWS_REGION
    Value: !Ref AWS::Region
  RunnerClusterArn:
    Description: Worker SCOPE_ECS_CLUSTER_ARN
    Value: !GetAtt RunnerCluster.Arn
  RunnerSubnetIds:
    Description: Worker SCOPE_ECS_SUBNET_IDS
    Value: !Join [",", [!Ref RunnerPublicSubnetOne, !Ref RunnerPublicSubnetTwo]]
  RunnerSecurityGroupId:
    Description: Worker SCOPE_ECS_SECURITY_GROUP_ID
    Value: !GetAtt RunnerSecurityGroup.GroupId
  RunnerExecutionRoleArn:
    Description: Worker SCOPE_ECS_EXECUTION_ROLE_ARN
    Value: !GetAtt RunnerTaskExecutionRole.Arn
  RunnerLogGroupName:
    Description: Worker SCOPE_ECS_LOG_GROUP
    Value: !Ref RunnerLogGroup
  RailwayDispatcherUserName:
    Description: IAM user for the Railway worker; create its access key outside CloudFormation.
    Value: !Ref RailwayDispatcherUser
  ChecksImageRepositoryName:
    Description: Private ECR repository name for raw and SOCI v2 checks images.
    Value: !Ref ChecksImageRepository
  ChecksImageRepositoryUri:
    Description: Private ECR repository URI for raw and SOCI v2 checks images.
    Value: !GetAtt ChecksImageRepository.RepositoryUri
  ChecksImagePublisherRoleArn:
    Description: GitHub Actions OIDC role for publishing checks images.
    Value: !GetAtt ChecksImagePublisherRole.Arn
  GitHubInfrastructureRoleArn:
    Description: GitHub Actions OIDC role for CLI-driven infrastructure plans and applies.
    Value: !GetAtt GitHubInfrastructureRole.Arn
