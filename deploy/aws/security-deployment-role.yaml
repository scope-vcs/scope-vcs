AWSTemplateFormatVersion: '2010-09-09'
Description: Protected Scope runtime permissions boundary and constrained CloudFormation execution role
Parameters:
  RegistryCredentialsSecretArn:
    Type: String
    Default: ''
    AllowedPattern: ^$|^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$
Conditions:
  HasRegistrySecret:
    Fn::Not:
    - Fn::Equals:
      - Ref: RegistryCredentialsSecretArn
      - ''
Resources:
  RuntimeBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: scope-runtime-boundary
      Description: Maximum runtime grants for Scope ECS execution and validated dispatch
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Action:
          - logs:CreateLogStream
          - logs:PutLogEvents
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/scope-vcs/production/*
          - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/scope-cloud-runner-production-dispatch-broker*
        - Effect: Allow
          Action:
          - ecr:GetAuthorizationToken
          - ecs:RegisterTaskDefinition
          - ecs:ListTaskDefinitions
          Resource: '*'
        - Effect: Allow
          Action:
          - ecr:BatchCheckLayerAvailability
          - ecr:BatchGetImage
          - ecr:GetDownloadUrlForLayer
          Resource:
            Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/scope-vcs/production/checks
        - Effect: Allow
          Action:
          - secretsmanager:CreateSecret
          - secretsmanager:DescribeSecret
          - secretsmanager:DeleteSecret
          - secretsmanager:TagResource
          - secretsmanager:GetSecretValue
          Resource:
            Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:scope-vcs/scope-vcs-production-runner/attempts/*
        - Effect: Allow
          Action:
          - ecs:RunTask
          Resource:
            Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/scope-runner-attempt_*:*
          Condition:
            ArnEquals:
              ecs:cluster:
                Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/scope-vcs-production-runner
        - Effect: Allow
          Action:
          - ecs:DescribeTaskDefinition
          Resource:
            Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/scope-runner-attempt_*:*
        - Effect: Allow
          Action:
          - ecs:DescribeTasks
          - ecs:StopTask
          Resource:
            Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/scope-vcs-production-runner/*
          Condition:
            ArnEquals:
              ecs:cluster:
                Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/scope-vcs-production-runner
        - Effect: Allow
          Action:
          - ecs:ListTasks
          Resource: '*'
          Condition:
            ArnEquals:
              ecs:cluster:
                Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/scope-vcs-production-runner
        - Effect: Allow
          Action:
          - ecs:TagResource
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/scope-vcs-production-runner/*
          - Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/scope-runner-attempt_*:*
        - Effect: Allow
          Action:
          - iam:PassRole
          Resource:
            Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/scope-cloud-runner-production-task-execution
          Condition:
            StringEquals:
              iam:PassedToService: ecs-tasks.amazonaws.com
        - Effect: Allow
          Action:
          - dynamodb:GetItem
          - dynamodb:PutItem
          - dynamodb:UpdateItem
          Resource:
            Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/scope-cloud-runner-production-dispatch-journal
        - Fn::If:
          - HasRegistrySecret
          - Effect: Allow
            Action:
            - secretsmanager:GetSecretValue
            Resource:
              Ref: RegistryCredentialsSecretArn
          - Ref: AWS::NoValue
        - Effect: Allow
          Action:
          - ecs:DeregisterTaskDefinition
          Resource: '*'
  InfrastructureExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: scope-infrastructure-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: cloudformation.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: scope-stack-resources
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - iam:GetRole
            - iam:GetRolePolicy
            - iam:ListRolePolicies
            - iam:ListAttachedRolePolicies
            - iam:ListRoleTags
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/scope-cloud-runner-production-task-execution
            - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/scope-cloud-runner-production-dispatch-broker
          - Effect: Allow
            Action:
            - iam:CreateRole
            - iam:PutRolePermissionsBoundary
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/scope-cloud-runner-production-task-execution
            - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/scope-cloud-runner-production-dispatch-broker
            Condition:
              ArnEquals:
                iam:PermissionsBoundary:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/scope-runtime-boundary
          - Effect: Allow
            Action:
            - iam:UpdateAssumeRolePolicy
            - iam:PutRolePolicy
            - iam:DeleteRolePolicy
            - iam:DeleteRole
            - iam:TagRole
            - iam:UntagRole
            - iam:UpdateRole
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/scope-cloud-runner-production-task-execution
            - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/scope-cloud-runner-production-dispatch-broker
          - Effect: Deny
            Action:
            - iam:DeleteRolePermissionsBoundary
            Resource: '*'
          - Effect: Allow
            Action:
            - iam:PassRole
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/scope-cloud-runner-production-task-execution
            Condition:
              StringEquals:
                iam:PassedToService: ecs-tasks.amazonaws.com
          - Effect: Allow
            Action:
            - iam:PassRole
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/scope-cloud-runner-production-dispatch-broker
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com
          - Effect: Allow
            Action:
            - lambda:CreateFunction
            - lambda:UpdateFunctionCode
            - lambda:UpdateFunctionConfiguration
            - lambda:DeleteFunction
            - lambda:GetFunction
            - lambda:GetFunctionConfiguration
            - lambda:ListTags
            - lambda:TagResource
            - lambda:UntagResource
            - lambda:PutFunctionConcurrency
            - lambda:DeleteFunctionConcurrency
            - lambda:GetFunctionConcurrency
            Resource:
              Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:scope-cloud-runner-production-dispatch-broker
          - Effect: Allow
            Action:
            - dynamodb:CreateTable
            - dynamodb:UpdateTable
            - dynamodb:DeleteTable
            - dynamodb:DescribeTable
            - dynamodb:DescribeContinuousBackups
            - dynamodb:UpdateContinuousBackups
            - dynamodb:DescribeTimeToLive
            - dynamodb:UpdateTimeToLive
            - dynamodb:ListTagsOfResource
            - dynamodb:TagResource
            - dynamodb:UntagResource
            Resource:
              Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/scope-cloud-runner-production-dispatch-journal
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:DeleteLogGroup
            - logs:PutRetentionPolicy
            - logs:DeleteRetentionPolicy
            - logs:TagResource
            - logs:UntagResource
            - logs:ListTagsForResource
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/scope-vcs/production/*
            - Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/scope-cloud-runner-production-dispatch-broker*
          - Effect: Allow
            Action:
            - logs:DescribeLogGroups
            - logs:DescribeResourcePolicies
            Resource: '*'
          - Effect: Allow
            Action:
            - ecs:CreateCluster
            - ecs:DeleteCluster
            - ecs:DescribeClusters
            - ecs:PutClusterCapacityProviders
            - ecs:UpdateCluster
            - ecs:UpdateClusterSettings
            - ecs:TagResource
            - ecs:UntagResource
            - ecs:ListTagsForResource
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/scope-vcs-production-runner
          - Effect: Allow
            Action:
            - ecr:CreateRepository
            - ecr:DeleteRepository
            - ecr:DescribeRepositories
            - ecr:GetLifecyclePolicy
            - ecr:PutLifecyclePolicy
            - ecr:DeleteLifecyclePolicy
            - ecr:PutImageScanningConfiguration
            - ecr:PutImageTagMutability
            - ecr:ListTagsForResource
            - ecr:TagResource
            - ecr:UntagResource
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/scope-vcs/production/checks
          - Effect: Allow
            Action:
            - ec2:DescribeVpcs
            - ec2:DescribeVpcAttribute
            - ec2:DescribeSubnets
            - ec2:DescribeRouteTables
            - ec2:DescribeInternetGateways
            - ec2:DescribeSecurityGroups
            - ec2:DescribeSecurityGroupRules
            - ec2:DescribeAvailabilityZones
            - ec2:DescribeTags
            Resource: '*'
          - Effect: Allow
            Action:
            - ec2:ModifyVpcAttribute
            - ec2:DeleteVpc
            - ec2:DeleteSubnet
            - ec2:ModifySubnetAttribute
            - ec2:DeleteRouteTable
            - ec2:CreateRoute
            - ec2:ReplaceRoute
            - ec2:DeleteRoute
            - ec2:DeleteInternetGateway
            - ec2:AuthorizeSecurityGroupEgress
            - ec2:RevokeSecurityGroupEgress
            - ec2:AuthorizeSecurityGroupIngress
            - ec2:RevokeSecurityGroupIngress
            - ec2:DeleteSecurityGroup
            - ec2:CreateTags
            - ec2:DeleteTags
            Resource:
              Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:*
            Condition:
              StringEquals:
                aws:ResourceTag/aws:cloudformation:stack-name: scope-cloud-runner-production
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:GetObjectVersion
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::scope-dispatch-broker-artifacts-${AWS::AccountId}-${AWS::Region}/*
          - Effect: Deny
            Action:
            - iam:*
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/scope-infrastructure-execution
            - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/scope-security-*
            - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*github*
            - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/*
            - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/scope-runtime-boundary
            Sid: ProtectTrustAndPermissionOwners
          - Effect: Deny
            Action:
            - secretsmanager:GetSecretValue
            - secretsmanager:BatchGetSecretValue
            - ssm:GetParameter*
            - kms:Decrypt
            - sts:AssumeRole
            Resource: '*'
  BrokerArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName:
        Fn::Sub: scope-dispatch-broker-artifacts-${AWS::AccountId}-${AWS::Region}
      OwnershipControls:
        Rules:
        - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
  BrokerArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: BrokerArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Sid: RequireArtifactTLS
          Effect: Deny
          Principal: '*'
          Action: s3:*
          Resource:
          - Fn::GetAtt:
            - BrokerArtifactBucket
            - Arn
          - Fn::Sub: ${BrokerArtifactBucket.Arn}/*
          Condition:
            Bool:
              aws:SecureTransport: 'false'
Outputs:
  ExecutionRoleArn:
    Value:
      Fn::GetAtt:
      - InfrastructureExecutionRole
      - Arn
  RuntimeBoundaryArn:
    Value:
      Ref: RuntimeBoundary
  BrokerArtifactBucketName:
    Value:
      Ref: BrokerArtifactBucket
