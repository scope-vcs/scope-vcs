[workspace]
members = [
    "api",
    "cli-downloads",
    "media-worker",
    "media-service",
    "crates/scope-media-storage",
    "repo-router",
    "crates/scope-api-contract",
    "crates/scope-content-lifecycle",
    "crates/scope-dependency-analyzer",
    "crates/scope-domain",
    "crates/scope-postgres",
    "crates/scope-git",
    "crates/scope-storage",
    "crates/scope-product-analytics",
    "crates/scope-git-process",
    "crates/scope-service-runtime",
    "worker",
]
exclude = ["cli"]
resolver = "3"

[patch.crates-io]
sqlx-core = { git = "https://github.com/transact-rs/sqlx", rev = "f1e94ec34dd5f11ad6488a3a8ac7988439a3f757" }
sqlx-postgres = { git = "https://github.com/transact-rs/sqlx", rev = "f1e94ec34dd5f11ad6488a3a8ac7988439a3f757" }

[workspace.lints.rust]
unreachable_pub = "warn"
unsafe_code = "warn"

[workspace.lints.clippy]
allow_attributes = "warn"
dbg_macro = "warn"
expect_used = "warn"
let_underscore_must_use = "warn"
match_same_arms = "warn"
redundant_clone = "warn"
todo = "warn"
unimplemented = "warn"
unnecessary_wraps = "warn"
unused_async = "warn"
unused_self = "warn"
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = "symbols"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/adamblumoff/scope-vcs"

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.89"
aws-credential-types = "1.3.0"
aws-sdk-s3 = { version = "1.149.0", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sigv4 = "1.6.0"
aws-smithy-http = "0.64.0"
axum = "0.8.7"
axum-tracing-opentelemetry = "0.42"
base64 = "0.22.1"
bytes = "1.11.0"
chacha20poly1305 = "0.11.0"
getrandom = "0.3.4"
hex = "0.4.3"
hmac = "0.13.0"
http = "1.4.2"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
libc = "0.2.177"
opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.33"
opentelemetry-http = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "logs", "http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = "0.33"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
schemars = "1.2.1"
sha1 = "0.11.0"
sha2 = "0.11.0"
tempfile = "3.23.0"
thiserror = "2.0.18"
time = { version = "0.3.44", features = ["formatting"] }
tokio = "1.48.0"
tower = "0.5.3"
tower-http = "0.6.8"
tracing = "0.1.44"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
ts-rs = "12.0.1"
url = "2.5.8"

scope_api_contract = { package = "scope-api-contract", path = "crates/scope-api-contract" }
scope_content_lifecycle = { package = "scope-content-lifecycle", path = "crates/scope-content-lifecycle" }
scope_dependency_analyzer = { package = "scope-dependency-analyzer", path = "crates/scope-dependency-analyzer" }
scope_domain = { package = "scope-domain", path = "crates/scope-domain" }
scope_git = { package = "scope-git", path = "crates/scope-git" }
scope_git_process = { package = "scope-git-process", path = "crates/scope-git-process" }
scope_storage = { package = "scope-storage", path = "crates/scope-storage" }
scope_product_analytics = { package = "scope-product-analytics", path = "crates/scope-product-analytics" }
scope_postgres = { package = "scope-postgres", path = "crates/scope-postgres" }

scope_media_storage = { package = "scope-media-storage", path = "crates/scope-media-storage" }

scope_service_runtime = { package = "scope-service-runtime", path = "crates/scope-service-runtime" }
